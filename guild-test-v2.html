<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7e9">
  <title>두더지도굴단 길드전 임무판</title>
  <style>
    :root{--bg:#f7efdf;--paper:#fffaf0;--brown:#4b3024;--muted:#8b7462;--line:#dec9aa;--gold:#e5b541;--red:#b34b43;--green:#55733c;--purple:#8553a3}
    *{box-sizing:border-box}
    html{background:#ead6b3}
    body{margin:0;background:var(--bg);color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
    button,input,select{font:inherit;-webkit-tap-highlight-color:transparent}
    button{cursor:pointer}
    main{width:min(100%,720px);min-height:100vh;margin:auto;padding-bottom:28px;background:linear-gradient(180deg,#fff7e9 0,#f7efdf 380px)}
    .topbar{padding:14px 14px 11px;border-bottom:1px solid #e5d3b8;background:rgba(255,250,240,.97)}
    .titleline{display:flex;align-items:center;gap:8px}
    .homebtn{display:grid;width:32px;height:32px;flex:none;place-items:center;border:1px solid #e2c8a1;border-radius:10px;background:#fff;color:var(--brown);text-decoration:none;font-size:22px;font-weight:900}
    h1{margin:0;font-size:20px;font-weight:950;letter-spacing:-.05em}
    .beta{padding:3px 7px;border-radius:999px;background:#ffe497;color:#77500b;font-size:9px;font-weight:950;letter-spacing:.05em}
    #sync{display:block;margin:4px 0 0 40px;color:#917967;font-size:10px;font-weight:700}
    .filterdock{position:sticky;top:0;z-index:30;padding:9px 9px 8px;border-bottom:1px solid #ddc6a3;background:rgba(247,239,223,.95);box-shadow:0 8px 18px rgba(93,59,35,.08);backdrop-filter:blur(12px)}
    .tabs{display:grid;height:42px;grid-template-columns:1.08fr repeat(4,1fr);gap:3px;padding:3px;border-radius:13px;background:#ead9bc}
    .tab{display:flex;min-width:0;align-items:center;justify-content:center;gap:3px;padding:0 2px;border:0;border-radius:10px;background:transparent;color:#715b4b;font-size:11px;font-weight:900}
    .tab b{display:grid;min-width:17px;height:17px;place-items:center;padding:0 4px;border-radius:999px;background:rgba(116,83,59,.1);font-size:9px}
    .tab.on{background:var(--paper);box-shadow:0 1px 5px rgba(84,52,29,.12)}
    .tab[data-f=delete].on{color:#ad4139}.tab[data-f=keep].on{color:var(--green)}.tab[data-f=high].on{color:#9a6500}.tab[data-f=only].on{color:#75488f}
    .tools{display:grid;grid-template-columns:minmax(0,1fr) 68px 88px;gap:5px;margin-top:7px}
    .search{position:relative;min-width:0}
    .search>span{position:absolute;top:50%;left:10px;transform:translateY(-50%);color:#9b836e;font-size:16px}
    .search input{width:100%;height:36px;padding:0 29px 0 31px;border:1px solid #dac6a8;border-radius:11px;outline:0;background:#fffaf2;color:#51382b;font-size:13px;font-weight:700}
    .search input:focus{border-color:#b67d56;box-shadow:0 0 0 2px rgba(182,125,86,.15)}
    .clear{position:absolute;top:50%;right:4px;display:none;width:28px;height:28px;place-items:center;transform:translateY(-50%);border:0;background:transparent;color:#8e7562}
    .clear.show{display:grid}
    .tools select{min-width:0;height:36px;padding:0 5px;border:1px solid #dac6a8;border-radius:10px;outline:0;background:#fffaf2;color:#60493a;font-size:10px;font-weight:850}
    .board{padding:10px}
    .resultline{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px;color:#806b59;font-size:11px;font-weight:750}
    .resultline b{color:#4e3528;font-size:13px}
    .legend{display:flex;align-items:center;gap:5px}.legend:before{width:8px;height:8px;border-radius:3px;background:#d18a82;content:""}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .card{position:relative;min-width:0;overflow:hidden;padding:5px 5px 6px;border:2px solid #e2cda9;border-radius:13px;background:linear-gradient(180deg,#fff8e8,#ffefd1);box-shadow:0 3px 8px rgba(103,66,37,.12),inset 0 0 0 1px rgba(255,255,255,.75)}
    .card.status-delete{border-color:#ce8d84;background:linear-gradient(180deg,#f5e5df,#efd8d0)}
    .card.status-high{border-color:var(--gold);background:linear-gradient(180deg,#fff9df,#ffebae);box-shadow:0 3px 10px rgba(174,118,13,.18),inset 0 0 0 1px #fff9dc}
    .card.is-only{box-shadow:0 0 0 2px #9d6fba,0 4px 10px rgba(86,50,107,.16)}
    .cardtop{position:absolute;z-index:4;top:5px;right:5px;left:5px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
    .grade,.judge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:950}
    .grade{min-width:25px;height:19px;padding:0 5px;color:#fff;font-size:8px;text-shadow:0 1px 1px rgba(0,0,0,.15)}
    .grade-UR{background:linear-gradient(135deg,#f18eb7,#ae66d4)}.grade-SSR{background:linear-gradient(135deg,#f4c638,#dd762c)}.grade-SR{background:linear-gradient(135deg,#ad8bdd,#7055a6)}.grade-R{background:#568fbd}.grade-N{background:#65a46e}
    .judge{height:18px;padding:0 6px;border:1px solid transparent;font-size:8px}
    .judge-delete{border-color:#db958c;background:#fff1ed;color:#a33e36}.judge-keep{border-color:#b5c69c;background:#f0f5e8;color:#4f6b39}.judge-high{border-color:#e7bd55;background:#fff5ce;color:#8c5a00}
    .only{position:absolute;z-index:5;top:25px;right:-24px;width:78px;padding:2px 0;transform:rotate(45deg);background:var(--purple);color:#fff;text-align:center;font-size:7px;font-weight:950;letter-spacing:.08em}
    .art{position:relative;display:grid;overflow:hidden;aspect-ratio:1;margin-top:17px;place-items:center;border-radius:50%;background:radial-gradient(circle,#fffdf8 0 56%,rgba(255,255,255,.15) 57%);font-size:32px}
    .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .status-delete .art img{filter:grayscale(.8) saturate(.5);opacity:.56}
    .card h2{display:-webkit-box;min-height:29px;margin:3px 1px 2px;overflow:hidden;color:#55382a;font-size:10px;line-height:1.4;font-weight:900;text-align:center;letter-spacing:-.025em;-webkit-box-orient:vertical;-webkit-line-clamp:2}
    .status-delete h2{color:#8b625b}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:3px}
    .score,.hold{display:flex;height:25px;align-items:center;justify-content:center;gap:3px;border:1px solid #dec59e;border-radius:8px;background:rgba(255,255,255,.72);color:#78533b;font-size:11px;font-weight:950}
    .score i{color:#dc9818;font-style:normal}.hold{color:#47698a}.hold:active{transform:scale(.95)}.status-delete .stats{opacity:.72}.status-high .score{border-color:#e0b64d;color:#986200}
    .empty{padding:70px 20px;border:1px dashed #d4ba94;border-radius:16px;background:rgba(255,250,240,.7);text-align:center;font-weight:850}
    .rule{margin:6px 10px 0;padding:10px 12px;border-radius:12px;background:#eadbc4;color:#725d4c;font-size:10px;line-height:1.55}.rule b{margin-right:5px;color:#4e3528}
    .sheetback{position:fixed;inset:0;z-index:80;display:none;background:rgba(35,24,18,.45)}.sheetback.open{display:block}
    .sheet{position:absolute;right:0;bottom:0;left:0;width:min(100%,720px);max-height:75vh;margin:auto;overflow-y:auto;border:1px solid #d9bf98;border-radius:20px 20px 0 0;background:#fff9ed;box-shadow:0 -12px 35px rgba(53,34,23,.2)}
    .handle{width:42px;height:4px;margin:8px auto 0;border-radius:999px;background:#d1b892}
    .close{position:absolute;top:12px;right:12px;z-index:2;width:32px;height:32px;border:0;border-radius:50%;background:#f0e2cc;color:#725744;font-size:18px}
    .sheethead{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:12px;padding:12px 50px 12px 18px}
    .sheetart{position:relative;display:grid;overflow:hidden;width:74px;height:74px;place-items:center;border:1px solid #ead5b4;border-radius:18px;background:#fff;font-size:28px}.sheetart img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    .sheetbadges{display:flex;gap:5px;margin-bottom:5px}.sheet h2{margin:0;font-size:18px;font-weight:950;letter-spacing:-.035em}.sheetdesc{margin:3px 0 0;color:#866f5e;font-size:12px;font-weight:700}
    .deletecall{display:none;margin:0 18px 12px;padding:9px 11px;border:1px solid #e2aaa2;border-radius:10px;background:#fff0ec;color:#99443b;font-size:12px;font-weight:800}
    .ownerbox{padding:0 18px calc(24px + env(safe-area-inset-bottom,0px))}.ownerbox h3{margin:3px 0 9px;font-size:13px;font-weight:950}.ownerlist{display:flex;flex-wrap:wrap;gap:6px}.ownerlist span{padding:6px 9px;border:1px solid #d9c3a4;border-radius:999px;background:#fff;color:#5c4637;font-size:12px;font-weight:800}.noowner{padding:14px;border-radius:10px;background:#f2e6d4;color:#866f5e;font-size:12px;text-align:center}
    .topbtn{position:fixed;right:max(14px,calc((100vw - 720px)/2 + 14px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:55;display:grid;width:48px;height:48px;place-items:center;border:0;border-radius:50%;background:#4a2b1d;color:#fff;opacity:0;pointer-events:none;box-shadow:0 5px 14px rgba(59,35,22,.24);font-size:11px;font-weight:900}.topbtn.show{opacity:1;pointer-events:auto}
    @media(min-width:520px){.board{padding:14px}.grid{gap:10px}.card{padding:8px 8px 9px;border-radius:16px}.card h2{min-height:35px;font-size:13px}.score,.hold{height:31px;font-size:13px}.grade{height:21px;font-size:9px}.judge{height:20px;font-size:9px}}
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <div class="titleline"><a class="homebtn" href="./" aria-label="도감 홈으로">‹</a><h1>길드전 임무판</h1><span class="beta">BETA</span></div>
      <small id="sync">보유 현황 불러오는 중…</small>
    </header>
    <section class="filterdock" aria-label="임무 필터">
      <nav class="tabs" id="nav">
        <button class="tab on" data-f="all"><span>전체</span><b id="countAll">0</b></button>
        <button class="tab" data-f="delete"><span>삭제</span><b id="countDelete">0</b></button>
        <button class="tab" data-f="keep"><span>유지</span><b id="countKeep">0</b></button>
        <button class="tab" data-f="high"><span>고득점</span><b id="countHigh">0</b></button>
        <button class="tab" data-f="only"><span>ONLY</span><b id="countOnly">0</b></button>
      </nav>
      <div class="tools">
        <div class="search"><span>⌕</span><input id="flowerSearch" type="search" placeholder="꽃 이름 검색" aria-label="꽃 이름 검색"><button class="clear" id="clearSearch" type="button" aria-label="검색어 지우기">×</button></div>
        <select id="gradeSelect" aria-label="등급 선택"><option value="all">전체</option><option>UR</option><option>SSR</option><option>SR</option><option>R</option><option>N</option></select>
        <select id="sort" aria-label="정렬 선택"><option value="score">점수순</option><option value="holders">보유 적은순</option><option value="name">가나다순</option></select>
      </div>
    </section>
    <section class="board">
      <div class="resultline"><span><b id="visibleCount">0</b>개 꽃</span><span class="legend">흐린 카드 = 삭제 대상</span></div>
      <div class="grid" id="grid"></div>
    </section>
    <p class="rule"><b>판정 기준</b>보유자 0명 또는 10점 이하 삭제 · 11~22점 유지 · 23점 이상 고득점 · 보유자 1명 ONLY</p>
  </main>
  <button id="topBtn" class="topbtn" type="button" aria-label="맨 위로">↑ TOP</button>
  <div class="sheetback" id="sheetBack" role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <section class="sheet">
      <div class="handle" aria-hidden="true"></div><button class="close" id="sheetClose" type="button" aria-label="닫기">×</button>
      <div class="sheethead">
        <div class="sheetart"><span>🌱</span><img id="sheetImage" alt=""></div>
        <div><div class="sheetbadges" id="sheetBadges"></div><h2 id="sheetName"></h2><p class="sheetdesc" id="sheetDesc"></p></div>
      </div>
      <p class="deletecall" id="deleteCall"></p>
      <div class="ownerbox"><h3>보유자</h3><div class="ownerlist" id="ownerList"></div></div>
    </section>
  </div>
  <script src="guild-catalog-images.js?v=20260829-1045"></script>
  <script src="guild-data-1.js"></script>
  <script src="guild-data-2.js"></script>
  <script src="guild-hi-01.js"></script>
  <script src="guild-hi-02.js"></script>
  <script src="guild-hi-03-04.js"></script>
  <script src="guild-hi-05-06.js"></script>
  <script src="guild-hi-07.js"></script>
  <script src="guild-hi-08.js"></script>
  <script src="guild-hi-pack-10.js"></script>
  <script src="guild-hi-pack-12.js"></script>
  <script src="guild-hi-pack-14.js"></script>
  <script src="guild-hi-pack-16.js"></script>
  <script src="guild-hi-pack-18.js"></script>
  <script src="guild-new-hi-1.js"></script>
  <script src="guild-new-hi-2.js"></script>
  <script src="guild-new-hi-3.js"></script>
  <script src="guild-new-hi-4.js"></script>
  <script src="guild-new-observations.js"></script>
  <script src="guild-auto-20260828.js"></script>
  <script src="guild-auto-late-20260828.js?v=20260828-2217"></script>
  <script src="guild-rank-a-20260901.js?v=20260901-0950"></script>
  <script>
    const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSighkaGKMuouQNsjGsanPYmZE9jJ03_mIqUJ4RnFPhr5LKKVwNf2ZrgFpRdPl1cSDn3s7t5xTOOyo0/pub?gid=129712828&single=true&output=csv';
    const RAW=window.GUILD_DATA||[],byName=new Map;
    RAW.forEach(x=>{let v=byName.get(x.name)||{name:x.name,thumb:'',obs:[]};if(x.thumb)v.thumb=x.thumb;let sc=Number(x.score);if(Number.isFinite(sc))v.obs.push({score:sc});byName.set(x.name,v)});
    const BASE=[...byName.values()].filter(v=>v.obs.length).map(v=>{let scores=v.obs.map(o=>o.score);return{...v,scoreMin:Math.min(...scores),scoreMax:Math.max(...scores),known:true}});
    let D=BASE.map(x=>({...x,h:[]})),filter='all',gradeFilter='all',query='';
    const $=id=>document.getElementById(id),norm=s=>String(s||'').trim().replace(/\s+/g,' '),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i],next=text[i+1];if(c==='"'){if(quoted&&next==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
    function status(x){if(!x.h.length)return'delete';if(!x.known)return'keep';return x.scoreMax<=10?'delete':x.scoreMax>=23?'high':'keep'}
    function scoreText(x){return x.known?(x.scoreMin===x.scoreMax?x.scoreMax:x.scoreMin+'~'+x.scoreMax):'-'}
    function imageOf(x){return x.thumb||(window.GUILD_CATALOG_IMAGES||{})[x.name]||''}
    function label(z){return z==='delete'?'삭제':z==='high'?'고득점':'유지'}
    function render(){
      let list=[...D],sortMode=$('sort').value;
      if(sortMode==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
      else if(sortMode==='holders')list.sort((a,b)=>a.h.length-b.h.length||a.name.localeCompare(b.name,'ko'));
      else list.sort((a,b)=>(b.known?b.scoreMax:-1)-(a.known?a.scoreMax:-1)||a.name.localeCompare(b.name,'ko'));
      list=list.filter(x=>(filter==='all'||(filter==='only'?x.h.length===1:filter===status(x)))&&(gradeFilter==='all'||x.grade===gradeFilter)&&(!query||x.name.includes(query)));
      $('visibleCount').textContent=list.length;
      $('grid').innerHTML=list.length?list.map(x=>{let z=status(x),img=imageOf(x),only=x.h.length===1;return '<article class="card status-'+z+(only?' is-only':'')+'"><div class="cardtop"><span class="grade grade-'+esc(x.grade||'N')+'">'+esc(x.grade||'-')+'</span><span class="judge judge-'+z+'">'+label(z)+'</span></div>'+(only?'<span class="only">ONLY</span>':'')+'<div class="art"><span>🌱</span>'+(img?'<img src="'+img+'" alt="'+esc(x.name)+' 꽃" loading="lazy" onerror="this.remove()">':'')+'</div><h2>'+esc(x.name)+'</h2><div class="stats"><span class="score"><i>✦</i>'+scoreText(x)+'</span><button class="hold" type="button" data-name="'+encodeURIComponent(x.name)+'" aria-label="'+esc(x.name)+' 보유자 '+x.h.length+'명 보기">♟ <b>'+x.h.length+'</b></button></div></article>'}).join(''):'<div class="empty" style="grid-column:1/-1">해당하는 꽃이 없습니다.</div>';
      $('countAll').textContent=D.length;$('countDelete').textContent=D.filter(x=>status(x)==='delete').length;$('countKeep').textContent=D.filter(x=>status(x)==='keep').length;$('countHigh').textContent=D.filter(x=>status(x)==='high').length;$('countOnly').textContent=D.filter(x=>x.h.length===1).length;
    }
    function openSheet(name){let x=D.find(v=>v.name===name);if(!x)return;let z=status(x),img=imageOf(x);$('sheetName').textContent=x.name;$('sheetDesc').textContent=(x.known?'길드전 '+scoreText(x)+'점':'길드전 점수 미확인')+' · 보유자 '+x.h.length+'명';$('sheetBadges').innerHTML='<span class="grade grade-'+esc(x.grade||'N')+'">'+esc(x.grade||'-')+'</span><span class="judge judge-'+z+'">'+label(z)+'</span>';$('sheetImage').src=img;$('sheetImage').style.display=img?'block':'none';let call=$('deleteCall');call.style.display=z==='delete'?'block':'none';call.textContent=!x.h.length?'길드 내 보유자가 없어 삭제 대상입니다.':scoreText(x)+'점으로 삭제 기준(10점 이하)에 해당합니다.';$('ownerList').innerHTML=x.h.length?x.h.map(owner=>'<span>'+esc(owner)+'</span>').join(''):'<p class="noowner" style="width:100%">현재 등록된 보유자가 없습니다.</p>';$('sheetBack').classList.add('open');document.body.style.overflow='hidden'}
    function closeSheet(){$('sheetBack').classList.remove('open');document.body.style.overflow=''}
    $('nav').onclick=e=>{let b=e.target.closest('.tab');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()};
    $('gradeSelect').onchange=e=>{gradeFilter=e.target.value;render()};$('sort').onchange=render;
    $('flowerSearch').oninput=e=>{query=norm(e.target.value);$('clearSearch').classList.toggle('show',!!query);render()};
    $('clearSearch').onclick=()=>{$('flowerSearch').value='';query='';$('clearSearch').classList.remove('show');render()};
    $('grid').onclick=e=>{let b=e.target.closest('.hold');if(b)openSheet(decodeURIComponent(b.dataset.name))};
    $('sheetClose').onclick=closeSheet;$('sheetBack').onclick=e=>{if(e.target===$('sheetBack'))closeSheet()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
    const topBtn=$('topBtn');addEventListener('scroll',()=>topBtn.classList.toggle('show',scrollY>500),{passive:true});topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
    render();
    (async()=>{try{let text=await fetch(CSV+'&_='+Date.now(),{cache:'no-store'}).then(r=>r.text()),rows=parseCSV(text),headers=rows[0].map(norm),nameIndex=headers.findIndex(x=>x==='꽃 이름'||x.includes('꽃 이름')),holderIndex=headers.findIndex(x=>x.includes('보유자')),gradeIndex=headers.findIndex(x=>x.includes('등급')),holders=new Map,grades=new Map;rows.slice(1).forEach(row=>{let name=norm(row[nameIndex]);if(name){holders.set(name,String(row[holderIndex]||'').split(',').map(norm).filter(Boolean));grades.set(name,norm(row[gradeIndex]).toUpperCase())}});let missions=new Map(BASE.filter(x=>grades.has(norm(x.name))).map(x=>[norm(x.name),x]));for(let[name,grade]of grades){let image=(window.GUILD_CATALOG_IMAGES||{})[name]||'',owned=holders.get(name)||[];if(missions.has(name)){missions.get(name).grade=grade;if(!missions.get(name).thumb)missions.get(name).thumb=image}else if(owned.length===0){missions.set(name,{name,thumb:image,known:false,grade})}}D=[...missions.values()].map(x=>({...x,h:holders.get(x.name)||[]}));$('sync').textContent='꽃 보유 현황 연동 완료';render()}catch(error){$('sync').textContent='보유 현황 연동 실패 · 저장된 임무 표시 중';render()}})();
  </script>
</body>
</html>

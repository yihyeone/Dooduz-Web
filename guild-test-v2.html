<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>두더지도굴단 길드전 임무표</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f1e7;color:#34251f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:720px;margin:auto;padding:18px 14px 70px}header{position:sticky;top:0;background:#f7f1e7f5;z-index:3;padding:10px 0}h1{font-size:20px;margin:0;color:#4a2b1d}small{color:#8c7b70}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.sum div,.table{background:#fffdf9;border:1px solid #e7ddd2;border-radius:12px}.sum div{padding:9px;text-align:center}.sum b{display:block;font-size:19px}nav{display:flex;gap:6px;overflow:auto}button,select{border:1px solid #e7ddd2;background:white;border-radius:999px;padding:7px 10px;color:#5c4a40}nav button.on{background:#4a2b1d;color:white}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 2px 7px;font-size:11px;color:#8c7b70}select{border-radius:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) 46px 52px 56px;gap:3px;align-items:center;min-height:60px;padding:0 8px;border-top:1px solid #eee6dd}.row:first-child{border-top:0}.head{min-height:36px;background:#f1e8dc;font-size:11px;font-weight:700}.flower{display:flex;align-items:center;gap:8px;min-width:0}.thumbwrap{width:44px;height:44px;flex:0 0 44px;border-radius:50%;overflow:hidden;border:1px solid #eadfd3;background:#f2e9df;display:flex;align-items:center;justify-content:center}.flower img{width:44px;height:44px;border-radius:50%;object-fit:cover;display:block;image-rendering:auto}.name{font-size:13px;font-weight:700;line-height:1.25}.score{text-align:center;font-weight:850}.hold{padding:7px 4px;font-size:12px;font-weight:800}.zero{background:#f7dfdf;color:#c94f4f}.judge{text-align:center;font-size:11px;font-weight:850;border-radius:7px;padding:6px 2px}.keep{background:#e1f1e8;color:#2f7d59}.high{background:#fff0cc;color:#a76a00}.del{background:#f7dfdf;color:#c94f4f}.detail{grid-column:1/-1;margin:0 -8px;padding:9px 12px;background:#f8f3ed;border-top:1px dashed #dfd2c6;font-size:12px;display:none}.open .detail{display:block}.note{font-size:11px;color:#8c7b70;line-height:1.5;margin-top:10px}</style></head><body>
<main><header><h1>⚔ 길드전 임무표 <small>BETA</small></h1><small id="sync">보유현황 불러오는 중…</small><section class="sum"><div><b id="total">0</b><small>확인 꽃</small></div><div><b id="high">0</b><small>고득점</small></div><div><b id="del">0</b><small>삭제 추천</small></div></section><nav id="nav"><button class="on" data-f="all">전체</button><button data-f="high">고득점</button><button data-f="keep">유지</button><button data-f="delete">삭제</button><button data-f="zero">미보유</button><button data-f="one">1명 보유</button></nav></header><div class="bar"><span>보유 명수를 누르면 보유자가 펼쳐집니다.</span><select id="sort"><option value="score">점수 높은순</option><option value="holders">보유 적은순</option><option value="name">가나다순</option></select></div><section class="table" id="table"></section><p class="note">꽃 수확 임무만 등록합니다. 꽃 이름은 꽃 보유현황 시트 기준이며, 보유자 0명 또는 10점 이하는 ‘삭제’, 23점 이상은 ‘고득점’으로 표시합니다.</p></main>
<script src="guild-data-1.js"></script><script src="guild-data-2.js"></script>
<script src="guild-hi-01.js"></script><script src="guild-hi-02.js"></script><script src="guild-hi-03-04.js"></script><script src="guild-hi-05-06.js"></script><script src="guild-hi-07.js"></script><script src="guild-hi-08.js"></script><script src="guild-hi-pack-10.js"></script><script src="guild-hi-pack-12.js"></script><script src="guild-hi-pack-14.js"></script><script src="guild-hi-pack-16.js"></script><script src="guild-hi-pack-18.js"></script>
<script>
const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSighkaGKMuouQNsjGsanPYmZE9jJ03_mIqUJ4RnFPhr5LKKVwNf2ZrgFpRdPl1cSDn3s7t5xTOOyo0/pub?gid=129712828&single=true&output=csv';
const RAW=window.GUILD_DATA||[];const byName=new Map();RAW.forEach(x=>byName.set(x.name,x));const BASE=[...byName.values()];let D=BASE.map(x=>({...x,h:[]})),f='all';
function pc(t){let a=[],r=[],c='',q=0;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'){if(q&&n=='"'){c+='"';i++}else q=!q}else if(x==','&&!q){r.push(c);c=''}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;r.push(c);if(r.some(Boolean))a.push(r);r=[];c=''}else c+=x}if(c||r.length){r.push(c);a.push(r)}return a}
function n(s){return String(s||'').trim().replace(/\s+/g,' ')}function st(x){return !x.h.length||x.score<=10?'delete':x.score>=23?'high':'keep'}
function render(){let a=[...D],s=sort.value;a.sort(s=='score'?(a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ko'):s=='holders'?(a,b)=>a.h.length-b.h.length||b.score-a.score:(a,b)=>a.name.localeCompare(b.name,'ko'));a=a.filter(x=>f=='all'||f==st(x)||(f=='zero'&&!x.h.length)||(f=='one'&&x.h.length==1));table.innerHTML='<div class="row head"><div>꽃</div><div>점수</div><div>보유</div><div>판단</div></div>'+a.map(x=>{let z=st(x),l=z=='delete'?'삭제':z=='high'?'고득점':'유지';return `<div class="row"><div class="flower"><span class="thumbwrap"><img src="${x.thumb}" alt="${x.name}" decoding="async"></span><div class="name">${x.name}</div></div><div class="score">${x.score}</div><button class="hold ${x.h.length?'':'zero'}">${x.h.length}명</button><div class="judge ${z=='delete'?'del':z}">${l}</div><div class="detail">${x.h.length?'<b>보유자</b> · '+x.h.join(' · '):'<b>보유자 없음</b>'}</div></div>`}).join('');document.querySelectorAll('.hold').forEach(b=>b.onclick=()=>b.closest('.row').classList.toggle('open'));total.textContent=D.length;high.textContent=D.filter(x=>st(x)=='high').length;del.textContent=D.filter(x=>st(x)=='delete').length}
nav.onclick=e=>{let b=e.target.closest('[data-f]');if(!b)return;f=b.dataset.f;nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));render()};sort.onchange=render;
(async()=>{try{let r=await fetch(CSV+'&_='+Date.now(),{cache:'no-store'}),a=pc(await r.text()),h=a[0].map(n),ni=h.findIndex(x=>x=='꽃 이름'),hi=h.findIndex(x=>x.includes('보유자')),m=new Map;a.slice(1).forEach(r=>m.set(n(r[ni]),String(r[hi]||'').split(',').map(n).filter(Boolean)));D=BASE.map(x=>({...x,h:m.get(n(x.name))||[]}));sync.textContent='꽃 보유현황 연동 완료 · '+m.size+'종 기준'}catch(e){sync.textContent='보유현황 연동 실패'}render()})();</script></body></html>

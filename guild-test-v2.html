<style>*{box-sizing:border-box}body{margin:0;background:#f7f1e7;color:#34251f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:720px;margin:auto;padding:18px 14px 70px}header{position:static;background:#f7f1e7;padding:10px 0}.titlebar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;margin:0 -14px;padding:8px 14px;background:#f7f1e7f7;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.homebtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 34px;border:1px solid #e7ddd2;border-radius:10px;background:#fffdf9;color:#4a2b1d;text-decoration:none;font-size:18px;font-weight:800}h1{font-size:20px;margin:0;color:#4a2b1d}small{color:#8c7b70}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.sum div,.table{background:#fffdf9;border:1px solid #e7ddd2;border-radius:12px}.sum div{padding:9px;text-align:center}.sum b{display:block;font-size:19px}nav{position:sticky;top:50px;z-index:29;display:flex;gap:6px;overflow:auto;margin:0 -14px;padding:8px 14px;background:#f7f1e7f7;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}button,select{border:1px solid #e7ddd2;background:white;border-radius:999px;padding:7px 10px;color:#5c4a40;font-weight:400}nav button[data-f="all"].on{background:#4a2b1d;border-color:#4a2b1d;color:white}nav button[data-f="high"]{background:#fff8e8;border-color:#ebd398;color:#9a6500;font-weight:800}nav button[data-f="high"].on{background:#a76a00;border-color:#a76a00;color:white}nav button[data-f="keep"]{background:#f0f8f3;border-color:#bedcc9;color:#2f7d59}nav button[data-f="keep"].on{background:#2f7d59;border-color:#2f7d59;color:white}nav button[data-f="delete"]{background:#fff2f2;border-color:#e6bcbc;color:#c94f4f}nav button[data-f="delete"].on{background:#c94f4f;border-color:#c94f4f;color:white}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 2px 7px;font-size:11px;color:#8c7b70}select{border-radius:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) 46px 52px 56px;gap:3px;align-items:center;min-height:60px;padding:0 8px;border-top:1px solid #eee6dd}.row:first-child{border-top:0}.head{position:sticky;top:104px;z-index:28;min-height:36px;background:#f1e8dc;font-size:11px;font-weight:700;box-shadow:0 1px 0 #e1d5c9}.flower{display:flex;align-items:center;gap:8px;min-width:0}.thumbwrap{width:44px;height:44px;flex:0 0 44px;border-radius:50%;overflow:hidden;background:#f2e9df;display:flex;align-items:center;justify-content:center}.flower img{width:56px;height:56px;max-width:none;flex:none;object-fit:cover;display:block;image-rendering:auto}.name{font-size:13px;font-weight:400;line-height:1.25}.score{text-align:center;font-weight:400}.hold{padding:7px 4px;font-size:12px;font-weight:400}.zero{background:#f7dfdf;color:#c94f4f}.judge{text-align:center;font-size:11px;font-weight:400;border-radius:7px;padding:6px 2px}.keep{background:#e1f1e8;color:#2f7d59}.high{background:#fff0cc;color:#a76a00;font-weight:800}.del{background:#f7dfdf;color:#c94f4f}.detail{grid-column:1/-1;margin:0 -8px;padding:9px 12px;background:#f8f3ed;border-top:1px dashed #dfd2c6;font-size:12px;display:none}.open .detail{display:block}.note{font-size:11px;color:#8c7b70;line-height:1.5;margin-top:10px}.guild-top-btn{position:fixed;right:max(16px,calc((100vw - 720px)/2 + 16px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;width:52px;height:52px;border:1px solid rgba(107,66,31,.24);border-radius:50%;background:rgba(74,43,29,.94);color:#fffaf0;box-shadow:0 8px 24px rgba(54,31,17,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease;cursor:pointer}.guild-top-btn.show{opacity:1;pointer-events:auto;transform:translateY(0)}.guild-top-btn span{font-size:20px;line-height:16px;font-weight:800}.guild-top-btn small{font-size:8px;line-height:11px;font-weight:900;letter-spacing:.04em;color:#fffaf0}</style></head><body>
<main><header><div class="titlebar"><a class="homebtn" href="./" aria-label="도감 홈으로 돌아가기">‹</a><h1>⚔ 길드전 임무표 <small>BETA</small></h1></div><small id="sync">보유현황 불러오는 중…</small><section class="sum"><div><b id="total">0</b><small>확인 꽃</small></div><div><b id="high">0</b><small>고득점</small></div><div><b id="del">0</b><small>삭제 추천</small></div></section></header><nav id="nav"><button class="on" data-f="all">전체</button><button data-f="high">고득점</button><button data-f="keep">유지</button><button data-f="delete">삭제</button></nav><div class="bar"><span>보유 명수를 누르면 보유자가 펼쳐집니다.</span><select id="sort"><option value="score">점수 높은순</option><option value="holders">보유 적은순</option><option value="name">가나다순</option></select></div><section class="table" id="table"></section><p class="note">꽃 수확 임무만 등록합니다. 꽃 이름은 꽃 보유현황 시트 기준이며, SSR 이상 꽃은 점수 미확인 항목도 모두 표시합니다. 미보유 꽃과 10점 이하는 ‘삭제’, 23점 이상은 ‘고득점’으로 표시합니다. 같은 꽃의 점수가 다르게 확인되면 최저~최고 점수로 표시합니다.</p></main><button id="guildTopBtn" class="guild-top-btn" type="button" aria-label="맨 위로" onclick="window.scrollTo({top:0,behavior:'smooth'})"><span aria-hidden="true">↑</span><small>TOP</small></button><script>addEventListener('scroll',()=>document.getElementById('guildTopBtn').classList.toggle('show',scrollY>700),{passive:true})</script>

<script>const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSighkaGKMuouQNsjGsanPYmZE9jJ03_mIqUJ4RnFPhr5LKKVwNf2ZrgFpRdPl1cSDn3s7t5xTOOyo0/pub?gid=129712828&single=true&output=csv';const RAW=window.GUILD_DATA||[];const byName=new Map();RAW.forEach(x=>{let v=byName.get(x.name);if(!v)v={name:x.name,thumb:'',obs:[]};if(typeof x.thumb==='string'&&x.thumb.startsWith('data:image/'))v.thumb=x.thumb;const sc=Number(x.score);if(Number.isFinite(sc))v.obs.push({score:sc,rank:x.rank||'B'});byName.set(x.name,v)});const BASE=[...byName.values()].filter(v=>v.obs.length).map(v=>{const scores=v.obs.map(o=>o.score),scoreMin=Math.min(...scores),scoreMax=Math.max(...scores);return {...v,scoreMin,scoreMax,score:scoreMax,known:true}});let D=BASE.map(x=>({...x,h:[]})),f='all';function pc(t){let a=[],r=[],c='',q=0;for(let i=0;i<t.length;i++){let x=t[i],n=t[i+1];if(x=='"'){if(q&&n=='"'){c+='"';i++}else q=!q}else if(x==','&&!q){r.push(c);c=''}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&n=='\n')i++;r.push(c);if(r.some(Boolean))a.push(r);r=[];c=''}else c+=x}if(c||r.length){r.push(c);a.push(r)}return a}function n(s){return String(s||'').trim().replace(/\s+/g,' ')}function st(x){if(!x.h.length)return'delete';if(!x.known)return'keep';return x.scoreMax<=10?'delete':x.scoreMax>=23?'high':'keep'}function scoreText(x){if(!x.known)return'-';return x.scoreMin===x.scoreMax?String(x.scoreMax):x.scoreMin+'~'+x.scoreMax}function render(){let a=[...D],s=sort.value;a.sort(s=='score'?(a,b)=>b.scoreMax-a.scoreMax||a.name.localeCompare(b.name,'ko'):s=='holders'?(a,b)=>a.h.length-b.h.length||b.scoreMax-a.scoreMax:(a,b)=>a.name.localeCompare(b.name,'ko'));a=a.filter(x=>f==='all'||f===st(x));table.innerHTML='<div class="row head"><div>꽃</div><div>점수</div><div>보유</div><div>판단</div></div>'+a.map(x=>{let z=st(x),l=z=='delete'?'삭제':z=='high'?'고득점':'유지';return `<div class="row"><div class="flower"><span class="thumbwrap">${x.thumb?`<img src="${x.thumb}" alt="${x.name}" decoding="async">`:`<span style="font-size:10px;color:#9b8a7d;font-weight:800">${x.grade||''}</span>`}</span><div class="name">${x.name}</div></div><div class="score">${scoreText(x)}</div><button class="hold ${x.h.length?'':'zero'}">${x.h.length}명</button><div class="judge ${z=='delete'?'del':z}">${l}</div><div class="detail">${x.h.length?'<b>보유자</b> · '+x.h.join(' · '):'<b>보유자 없음</b>'}</div></div>`}).join('');document.querySelectorAll('.hold').forEach(b=>b.onclick=()=>b.closest('.row').classList.toggle('open'));total.textContent=D.length;high.textContent=D.filter(x=>st(x)=='high').length;del.textContent=D.filter(x=>st(x)=='delete').length}nav.onclick=e=>{let b=e.target.closest('[data-f]');if(!b)return;f=b.dataset.f;nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));render()};sort.onchange=render;(async()=>{try{let r=await fetch(CSV+'&_='+Date.now(),{cache:'no-store'}),a=pc(await r.text()),h=a[0].map(n),ni=h.findIndex(x=>x=='꽃 이름'),hi=h.findIndex(x=>x.includes('보유자')),gi=h.findIndex(x=>x.includes('등급')),m=new Map,gm=new Map;a.slice(1).forEach(r=>{let nm=n(r[ni]);if(!nm)return;let hs=String(r[hi]||'').split(',').map(n).filter(Boolean),g=gi>=0?n(r[gi]).toUpperCase():'';m.set(nm,hs);gm.set(nm,g)});let bm=new Map(BASE.map(x=>[n(x.name),x]));for(const [nm,g] of gm){if(g==='SSR'||g==='UR'){if(!bm.has(nm))bm.set(nm,{name:nm,thumb:'',obs:[],scoreMin:null,scoreMax:null,score:null,known:false,grade:g});else bm.get(nm).grade=g}}D=[...bm.values()].map(x=>({...x,h:m.get(n(x.name))||[]}));sync.textContent='꽃 보유현황 연동 완료 · SSR↑ '+D.filter(x=>x.grade==='SSR'||x.grade==='UR').length+'종 포함'}catch(e){sync.textContent='보유현황 연동 실패'}render()})();</script></body></html>

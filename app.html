function parseCSV(t){let rows=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c==='\"'&&n==='\"'){v+='\"';i++}else if(c==='\"')q=false;else v+=c}else{if(c==='\"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v);rows.push(row);row=[];v=''}else if(c!=='\r')v+=c}}row.push(v);rows.push(row);return rows}
function convert(t){const a=parseCSV(t);if(!a.length)return[];const h=a[0].map(x=>x.trim());let ni=h.findIndex(x=>/꽃|flower|name/i.test(x)),gi=h.findIndex(x=>/등급|grade|rarity/i.test(x));if(ni<0)ni=0;if(gi<0)gi=1;return a.slice(1).filter(r=>r[ni]?.trim()).map((r,i)=>({name:r[ni].trim(),grade:(r[gi]||'').trim().toUpperCase(),owners:r.map((x,j)=>j!==ni&&j!==gi&&String(x||'').trim()?h[j]:'').filter(Boolean),order:i}))}
function updateStats(){const total=ALL.length,owned=ALL.filter(x=>x.owners.length).length,rate=total?Math.round(owned/total*100):0;document.getElementById('total').textContent=total;document.getElementById('owned').textContent=owned;document.getElementById('rate').textContent=rate+'%';document.getElementById('totalBar').style.width='100%';document.getElementById('ownedBar').style.width=rate+'%'}
function filteredRows(){const q=document.getElementById('q').value.trim().toLowerCase();let rows=ALL.filter(x=>(grade==='ALL'||x.grade===grade)&&(ownership==='ALL'||(ownership==='OWNED'?x.owners.length>0:x.owners.length===0))&&(!q||x.name.toLowerCase().includes(q)||x.owners.some(o=>o.toLowerCase().includes(q))));if(sortMode==='KOREAN')rows=[...rows].sort((a,b)=>a.name.localeCompare(b.name,'ko'));return rows}
function render(){const rows=filteredRows();visibleRows=rows;document.getElementById('count').textContent=rows.length+'종';const grid=document.getElementById('grid');if(!rows.length){grid.innerHTML='<div class="empty">조건에 맞는 꽃이 없습니다.</div>';return}grid.innerHTML=rows.map((x,i)=>{let src=IMG.get(norm(x.name)),own=x.owners.length;return `<button class="card grade-${ESC(x.grade)}" data-i="${i}">${src?`<img class="thumb" src="${ESC(src)}" alt="${ESC(x.name)}" loading="lazy">`:`<div class="thumb" style="display:grid;place-items:center;background:#f4eee4;color:#9b8b7b;font-weight:900">NO IMAGE</div>`}<div class="info"><h3>${ESC(x.name)}</h3><div class="meta"><span>${ESC(x.grade||'-')}</span><strong>${own?own+'명':'미보유'}</strong></div></div></button>`}).join('');grid.querySelectorAll('.card').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.i)))}
function openDetail(i){const x=visibleRows[i];if(!x)return;currentIndex=i;document.getElementById('big').src=IMG.get(norm(x.name))||'';document.getElementById('big').style.display=IMG.get(norm(x.name))?'inline-block':'none';document.getElementById('flowerName').textContent=x.name;document.getElementById('g').textContent=x.grade||'-';document.getElementById('oc').textContent=x.owners.length+'명';document.getElementById('owners').innerHTML=x.owners.length?x.owners.map(o=>`<span class="owner">${ESC(o)}</span>`).join(''):'<span class="owner none">보유 길드원 없음</span>';document.getElementById('sheet').showModal()}
let currentIndex=0;function moveDetail(step){if(!visibleRows.length)return;currentIndex=(currentIndex+step+visibleRows.length)%visibleRows.length;openDetail(currentIndex)}
async function load(){document.getElementById('grid').innerHTML='<div class="loading">Google 시트에서 데이터를 불러오는 중입니다…</div>';try{const r=await fetch(CSV+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);ALL=convert(await r.text());updateStats();render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div>'}}
document.getElementById('q').oninput=render;document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-g]').forEach(x=>x.classList.remove('active'));b.classList.add('active');grade=b.dataset.g;render()});document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-o]').forEach(x=>x.classList.remove('active'));b.classList.add('active');ownership=b.dataset.o;render()});document.getElementById('sort').onchange=e=>{sortMode=e.target.value;render()};document.getElementById('refresh').onclick=load;document.getElementById('x').onclick=()=>document.getElementById('sheet').close();document.getElementById('prev').onclick=()=>moveDetail(-1);document.getElementById('next').onclick=()=>moveDetail(1);document.getElementById('sheet').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});load();
</script>
<script id="doguldan-view-mode">
(()=>{
  const grid=document.getElementById('grid');
  const buttons=[...document.querySelectorAll('.view-toggle [data-view]')];
  if(!grid||!buttons.length)return;
  const KEY='dooduzViewMode';
  const apply=mode=>{
    const list=mode==='LIST';
    grid.classList.toggle('text-view',list);
    buttons.forEach(btn=>{
      const on=btn.dataset.view===mode;
      btn.classList.toggle('active',on);
      btn.setAttribute('aria-pressed',on?'true':'false');
    });
    try{localStorage.setItem(KEY,mode)}catch(e){}
  };
  let saved='CARD';
  try{saved=localStorage.getItem(KEY)==='LIST'?'LIST':'CARD'}catch(e){}
  apply(saved);
  buttons.forEach(btn=>btn.addEventListener('click',()=>apply(btn.dataset.view)));
})();
</script>
</body></html>

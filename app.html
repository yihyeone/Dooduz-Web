:root{--paper:#fffdf8;--orange:#f4a51c;--brown:#6b421f;--muted:#8b7b6a;--line:#eadcc8;--green:#679c4a;--shadow:0 9px 24px rgba(88,55,21,.10)}
*{box-sizing:border-box}body{margin:0;background:#f3eee6;color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}

.tools{position:sticky;top:0;z-index:5;padding:12px 0 10px;background:linear-gradient(#fff8e9 82%,transparent)}.search{display:flex;align-items:center;background:white;border:1px solid var(--line);border-radius:16px;height:48px;padding:0 13px}.search b{font-size:22px;margin-right:8px;color:var(--orange)}.search input{border:0;outline:0;flex:1;background:none}

.head{display:flex;justify-content:space-between;align-items:flex-end;margin:7px 2px 10px}.head h2{font-size:18px;margin:0}.head p{font-size:11px;color:var(--muted);margin:4px 0 0}.head b{font-size:12px;color:var(--muted)}

const norm=s=>String(s||"").replace(/\s+/g,"").replace(/[·ㆍ•]/g,"").toLowerCase();
const IMG=new Map(Object.entries(IMAGES).map(([k,v])=>[norm(k),v]));
let flowers=[],selected="ALL",ownership="ALL",sortMode="DEFAULT",query="",detailId=null;
function csv(t){let rows=[],r=[],v="",qq=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c=='"'){if(qq&&n=='"'){v+='"';i++}else qq=!qq}else if(c==','&&!qq){r.push(v);v=""}else if((c=='\n'||c=='\r')&&!qq){if(c=='\r'&&n=='\n')i++;r.push(v);v="";if(r.some(x=>x!=""))rows.push(r);r=[]}else v+=c}if(v||r.length){r.push(v);rows.push(r)}return rows}
function own(v){return String(v||"").split(/[,\/\n·|]+/).map(x=>x.trim()).filter(Boolean)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){
 grid.innerHTML='<div class="loading">Google 시트에서 데이터를 불러오는 중입니다…</div>';
 try{
  let res=await fetch(CSV+"&_="+Date.now(),{cache:"no-store"}); if(!res.ok)throw Error(res.status);
  let a=csv(await res.text()),h=a.shift().map(x=>x.trim());
  let ni=h.findIndex(x=>x.includes("꽃 이름")),gi=h.findIndex(x=>x.includes("등급")),oi=h.findIndex(x=>x.includes("보유자"));
  flowers=a.map((r,i)=>{let nm=(r[ni]||"").trim();return{id:i,n:nm,g:(r[gi]||"").trim().toUpperCase(),o:own(r[oi]),img:IMG.get(norm(nm))}}).filter(x=>x.n);
  total.textContent=flowers.length+"종";let o=flowers.filter(x=>x.o.length).length,p=flowers.length?(o/flowers.length*100):0;owned.textContent=o+"종";rate.textContent=p.toFixed(1)+"%";totalBar.style.width="100%";ownedBar.style.width=p+"%";render()
 }catch(e){grid.innerHTML='<div class="empty">시트 데이터를 불러오지 못했습니다.<br>새로고침 후 다시 확인해주세요.</div>'}
}
function list(){
 let z=query.toLowerCase();
 let a=flowers.filter(f=>
   (selected=="ALL"||f.g==selected) &&
   (ownership=="ALL" || (ownership=="OWNED" && f.o.length>0) || (ownership=="MISSING" && f.o.length===0)) &&
   (!z||f.n.toLowerCase().includes(z)||f.o.some(x=>x.toLowerCase().includes(z)))
 );
 if(sortMode=="KOREAN") a=[...a].sort((a,b)=>a.n.localeCompare(b.n,"ko"));
 return a
}
function render(){let a=list();count.textContent=a.length+"종";if(!a.length){grid.innerHTML='<div class="empty">조건에 맞는 꽃이 없습니다.</div>';return}grid.innerHTML=a.map(f=>`<button class="card" data-i="${f.id}"><img class="thumb" src="${f.img||''}" alt="${esc(f.n)}"><div class="info"><h3>${esc(f.n)}</h3><div class="meta"><span>${esc(f.g)}</span><strong>${f.o.length?f.o.length+"명":"미보유"}</strong></div></div></button>`).join("");document.querySelectorAll(".card").forEach(b=>b.onclick=()=>open(+b.dataset.i))}
function open(i){let f=flowers.find(x=>x.id==i);if(!f)return;detailId=i;document.getElementById("big").src=f.img||"";document.getElementById("flowerName").textContent=f.n;document.getElementById("g").textContent=f.g;document.getElementById("oc").textContent=f.o.length+"명";document.getElementById("owners").innerHTML=f.o.length?f.o.map(x=>`<span class="owner">${esc(x)}</span>`).join(""):'<span class="owner none">현재 등록된 보유자가 없습니다.</span>';if(!sheet.open)sheet.showModal()}
function moveDetail(step){let a=list(),i=a.findIndex(f=>f.id===detailId);if(!a.length)return;open(a[(i+step+a.length)%a.length].id)}
x.onclick=()=>sheet.close();
prev.onclick=()=>moveDetail(-1);
next.onclick=()=>moveDetail(1);
sheet.addEventListener("click",e=>{if(e.target===sheet)sheet.close()});
q.oninput=e=>{query=e.target.value;render()};
document.querySelectorAll(".grade-filters button").forEach(b=>b.onclick=()=>{
 selected=b.dataset.g;
 document.querySelectorAll(".grade-filters button").forEach(x=>x.classList.toggle("active",x===b));
 render()
});
document.querySelectorAll(".ownership-filters button").forEach(b=>b.onclick=()=>{
 ownership=b.dataset.o;
 document.querySelectorAll(".ownership-filters button").forEach(x=>x.classList.toggle("active",x===b));
 render()
});
sort.onchange=e=>{sortMode=e.target.value;render()};

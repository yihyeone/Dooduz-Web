<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8eb"><title>두더지도굴단 꽃 도감</title>
<style>
:root{--paper:#fffdf8;--orange:#f4a51c;--brown:#6b421f;--muted:#8b7b6a;--line:#eadcc8;--green:#679c4a;--shadow:0 9px 24px rgba(88,55,21,.10)}
*{box-sizing:border-box}html,body{min-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}body{margin:0;background:#f3eee6;color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}
button,input{font:inherit}.app{max-width:520px;min-height:100dvh;margin:auto;background:linear-gradient(#fffaf0,#fff6e5);padding:16px 15px calc(138px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 14px}.brand small{font-size:11px;font-weight:900;color:var(--orange)}.brand h1{font-size:22px;margin:3px 0 0}.refresh{border:1px solid var(--line);background:white;border-radius:99px;padding:9px 11px;color:var(--brown);font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:13px;box-shadow:var(--shadow)}.stat-top{display:flex;align-items:flex-end;justify-content:space-between;gap:6px}.stat span,.stat small{font-size:11px;color:var(--muted);font-weight:800}.stat strong{display:block;font-size:25px;margin:3px 0}.stat-percent{color:var(--green)!important;font-size:12px!important}.progress{height:7px;margin-top:8px;border-radius:99px;background:#eee6db;overflow:hidden}.progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#f4b234,#72a954);transition:width .35s ease}
.tools{position:sticky;top:0;z-index:5;padding:12px 0 10px;background:linear-gradient(#fff8e9 82%,transparent)}.search{display:flex;align-items:center;background:white;border:1px solid var(--line);border-radius:16px;height:48px;padding:0 13px}.search b{font-size:22px;margin-right:8px;color:var(--orange)}.search input{border:0;outline:0;flex:1;background:none;min-width:0}.search-clear{display:none;flex:none;width:28px;height:28px;border:0;border-radius:50%;background:#eee6db;color:var(--muted);font-size:17px;font-weight:900;line-height:1;align-items:center;justify-content:center;cursor:pointer}.search-clear.show{display:inline-flex}.search-clear:active{transform:scale(.94)}
.filter-bar{display:flex;align-items:center;gap:9px;overflow-x:auto;padding:9px 1px 2px;scrollbar-width:none}.filter-bar::-webkit-scrollbar{display:none}.filter-group{display:flex;align-items:center;gap:4px;flex:none}.filters{display:flex;gap:4px}.filters button{border:1px solid var(--line);background:white;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900;color:var(--muted);white-space:nowrap}.filters button.active{background:var(--brown);border-color:var(--brown);color:white}.filter-label{font-size:9px;font-weight:900;color:var(--muted);white-space:nowrap}.sort-row{display:flex;align-items:center;gap:4px;flex:none}.sort-row select{border:1px solid var(--line);background:white;color:var(--brown);border-radius:10px;padding:5px 7px;font-size:10px;font-weight:800;outline:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin:7px 2px 10px}.head h2{font-size:18px;margin:0}.head p{font-size:11px;color:var(--muted);margin:4px 0 0}.head b{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.card{padding:0;background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden;text-align:left;box-shadow:var(--shadow)}.thumb{width:100%;aspect-ratio:212/279;object-fit:cover;display:block}.info{padding:6px 6px 7px}.info h3{font-size:10px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--muted);font-weight:800;gap:2px}.meta>span{display:inline-flex;align-items:center;justify-content:center;min-width:27px;border:1px solid var(--line);background:white;border-radius:99px;padding:2px 6px;font-size:9px;font-weight:900;line-height:1.2;color:var(--muted);white-space:nowrap}.meta strong{color:var(--green)}
.grade-badge,.sheet .grade[class*="grade-"]{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:999px;padding:3px 8px;font-weight:950}.grade-badge.grade-UR,.sheet .grade.grade-UR{background:#fde7ef!important;border-color:#f3b3c8!important;color:#ad4f72!important}.grade-badge.grade-SSR,.sheet .grade.grade-SSR{background:#fff2c9!important;border-color:#e9c65e!important;color:#876417!important}.grade-badge.grade-SR,.sheet .grade.grade-SR{background:#eee4fa!important;border-color:#c7a7e7!important;color:#6e4b9e!important}.grade-badge.grade-R,.sheet .grade.grade-R{background:#e1f1fb!important;border-color:#9bc9e5!important;color:#37749a!important}.grade-badge.grade-N,.sheet .grade.grade-N{background:#e5f3df!important;border-color:#acd099!important;color:#4f7b3e!important}
.loading,.empty{grid-column:1/-1;padding:35px 18px;text-align:center;background:white;border:1px dashed var(--line);border-radius:17px;color:var(--muted)}
.image-missing{display:grid;place-items:center;background:#f4eee4;color:#9b8b7b;font-size:10px;font-weight:900;text-align:center}
.sheet{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 28px));max-width:none;max-height:calc(100dvh - 28px);margin:0;border:0;border-radius:24px;background:var(--paper);padding:18px 58px 24px;color:var(--brown);overflow:auto}.sheet::backdrop{background:rgba(47,31,18,.5);backdrop-filter:blur(3px)}.handle{display:none}.close{position:absolute;right:12px;top:10px;width:38px;height:38px;border-radius:50%;border:2px solid white;background:var(--brown);color:white;font-size:24px;line-height:1;z-index:3}.detail-main{text-align:center}.sheet img{width:25%;min-width:76px;max-width:105px;aspect-ratio:212/279;object-fit:cover;border-radius:12px;background:#f7f2ea}.sheet h3{font-size:30px;line-height:1.22;margin:13px -22px 7px;font-weight:950;letter-spacing:-.04em;word-break:keep-all}.detail-meta{display:flex;align-items:center;justify-content:center;gap:7px;min-height:25px}.grade{font-size:13px;color:var(--muted);font-weight:900}.flower-score{display:inline-flex;align-items:center;justify-content:center;border:1px solid #e1c9a7;border-radius:999px;padding:3px 8px;background:#fff7e8;color:#76531a;font-size:12px;font-weight:950;white-space:nowrap}.owner-title{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;font-weight:900}.owners{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.owner{padding:8px 10px;border-radius:99px;background:#ebf4e5;color:#4f783e;font-size:12px;font-weight:900}.owner.none{background:#eee9e2;color:var(--muted)}.owner.owner-link{text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px}.owner.owner-link:hover,.owner.owner-link:focus-visible{background:#dcefd2;outline:2px solid #8bb873;outline-offset:2px}.owner-link-arrow{font-size:15px;line-height:1}.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:48px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--brown);font-size:28px;font-weight:700;box-shadow:var(--shadow)}.nav-arrow.prev{left:9px}.nav-arrow.next{right:9px}
.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:11px 15px calc(11px + env(safe-area-inset-bottom,0px));background:rgba(255,253,248,.95);border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:10px;z-index:30}
.head-actions{display:flex;align-items:flex-end;gap:8px;flex:none}.view-toggle{display:flex;padding:2px;background:#efe6d9;border:1px solid var(--line);border-radius:10px;gap:2px}.view-toggle button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:5px 7px;font-size:9px;font-weight:900;line-height:1;white-space:nowrap}.view-toggle button.active{background:white;color:var(--brown);box-shadow:0 1px 4px rgba(88,55,21,.12)}
.grid.text-view{grid-template-columns:1fr;gap:6px}.grid.text-view .card{width:100%;border-radius:12px;box-shadow:none;background:rgba(255,255,255,.9)}.grid.text-view .thumb{display:none}.grid.text-view .card>:not(.info){display:none!important}.grid.text-view .info{padding:9px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;column-gap:8px}.grid.text-view .info h3{grid-column:2;grid-row:1;font-size:13px;margin:0;min-width:0}.grid.text-view .meta{display:contents}.grid.text-view .meta .grade-badge{grid-column:1;grid-row:1}.grid.text-view .info::after{content:attr(data-score);grid-column:3;grid-row:1;font-size:10px;font-weight:900;color:#76531a;white-space:nowrap}.grid.text-view .meta strong{grid-column:4;grid-row:1;font-size:10px;white-space:nowrap}
.card.grade-UR .info h3{color:#A05070}.card.grade-SSR .info h3{color:#806028}.card.grade-SR .info h3{color:#684898}.card.grade-R .info h3{color:#407090}.card.grade-N .info h3{color:#587840}
.grid:not(.text-view) .card.unowned .info{background:#eee7dc}
.grid:not(.text-view) .card.unowned .meta{color:#958979}.grid:not(.text-view) .card.unowned .meta strong{color:#958979}.grid.text-view .card.unowned{background:#eee7dc!important;border-color:#dfd3c4}.grid.text-view .card.unowned .meta strong{color:#958979!important}
.dooduz-top-btn{position:fixed;right:max(16px,calc((100vw - 520px)/2 + 16px));bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:40;width:52px;height:52px;border:1px solid rgba(107,66,31,.24);border-radius:50%;background:rgba(74,43,29,.94);color:#fffaf0;box-shadow:0 8px 24px rgba(54,31,17,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .18s ease,transform .18s ease;cursor:pointer}.dooduz-top-btn.show{opacity:1;pointer-events:auto;transform:translateY(0)}.dooduz-top-btn span{font-size:20px;line-height:16px;font-weight:800}.dooduz-top-btn small{font-size:8px;line-height:11px;font-weight:900;letter-spacing:.04em}

const IMAGES=window.GUILD_CATALOG_IMAGES||{};

// FLOWER_IMAGE_UPDATE_20260914_START
Object.assign(IMAGES,{"금빛 불꽃 산란":"./images/flower-assets/card-gold-fire-scatter-20260914.webp","황금 들꽃":"./images/flower-assets/card-golden-wildflower-20260914.webp","꿀단지 꽃 이야기":"./images/flower-assets/card-honey-pot-flower-story-20260914.webp","꽃 속의 단잠":"./images/flower-assets/card-sleep-among-flowers-20260914.webp","벌꿀 꽃의 안식처":"./images/flower-assets/card-honey-flower-rest-20260914.webp","꿀들판 선경":"./images/flower-assets/card-honey-field-seongyeong-20260914.webp"});
Object.assign(IMAGES,{"별빛 입맞춤 구름 양":"./images/flower-assets/ef85bb64ab07d385f893.webp","비단 꽃부채":"./images/flower-assets/f311f5d79d0fca3bbedb.webp","수박 스위트덕":"./images/flower-assets/22b17ecd767bfdeb109b.webp","금빛 솜털 삼지닥나무":"./images/flower-assets/card-refresh-20260913-15417aad295e.webp","눈꽃 금어초":"./images/flower-assets/e3168d2b0c0cc7fe7d53.webp","묵옥 아네모네":"./images/flower-assets/925cc5576aa737cda0ff.webp","벚꽃 핑크 설강화":"./images/flower-assets/cd2021a5d72b1cb89a21.webp","붉은태양 히비스커스":"./images/flower-assets/5d16b7859d425a229a9e.webp","연분홍 금어초":"./images/flower-assets/ea6f8d4689701fdb1290.webp","푸른 솜털 국화":"./images/flower-assets/card-refresh-20260913-eb988dd5002d.webp","핑크 페더 라크스퍼":"./images/flower-assets/card-refresh-20260913-cdd9f8c6b100.webp","하늘색 금어초":"./images/flower-assets/38d2e0fa2fe56901f9ea.webp","개상사화":"./images/flower-assets/b7872140bce16725f174.webp","따뜻한 등불":"./images/flower-assets/card-refresh-20260913-28a04239381e.webp","순백 폼폼 국화":"./images/flower-assets/037b34be0ef9652a8f6f.webp","연귤색 폼폼 국화":"./images/flower-assets/de0d566fdaf9562d4456.webp","연노랑 녹융호":"./images/flower-assets/09c44fb323e9dd13c9bf.webp","연분홍 폼폼 국화":"./images/flower-assets/ada9079ba7dc7b8afa7f.webp","자홍깃 재클린":"./images/flower-assets/card-refresh-20260913-cff6215d5a22.webp","주사 비단 등불":"./images/flower-assets/card-refresh-20260913-fbeeaff6b65e.webp","촉영 해당화":"./images/flower-assets/c235706807e5e4babcba.webp","하얀 눈의 영광":"./images/flower-assets/card-refresh-20260913-c51a040da2bf.webp"});
Object.assign(IMAGES,{"불꽃심장 꿈조개":"./images/flower-assets/card-fireheart-dream-shell-20260914.webp","은하수에 실은 꿈":"./images/flower-assets/card-milky-way-dream-20260914.webp","자색 앵초":"./images/flower-assets/card-purple-primrose-20260914.webp","귤빛 불꽃 시클라멘":"./images/flower-assets/card-orange-flame-cyclamen-20260914.webp","금실 익소라":"./images/flower-assets/card-golden-thread-ixora-20260914.webp","노란 눈의 영광":"./images/flower-assets/card-yellow-glory-of-snow-20260914.webp","보라솜털 시클라멘":"./images/flower-assets/card-purple-fuzz-cyclamen-20260914.webp","블루스타 납매":"./images/flower-assets/card-bluestar-wintersweet-20260914.webp"});
Object.assign(IMAGES,{"노란줄무늬 깃털초":"./images/flower-assets/card-yellow-striped-featherflower-r-20260914.webp","먹푸른 깃털초":"./images/flower-assets/card-dark-blue-featherflower-r-20260914.webp","연분홍 익소라":"./images/flower-assets/card-light-pink-ixora-r-20260914.webp","썬글로우 히페리쿰":"./images/flower-assets/card-sunglow-hypericum-r-20260914.webp","연분홍 갯질경":"./images/flower-assets/card-light-pink-sea-lavender-r-20260914.webp"});
// FLOWER_IMAGE_UPDATE_20260914_END
Object.assign(IMAGES,window.GUILD_CATALOG_IMAGES||{});
const norm=s=>String(s||'').replace(/[\s·ㆍ•・]/g,'').toLowerCase();
const IMG=new Map(Object.entries(IMAGES).map(([k,v])=>[norm(k),v]));
Object.entries(window.GUILD_CATALOG_IMAGES||{}).forEach(([name,path])=>IMG.set(norm(name),path));
const ESC=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
let ALL=[],grade='ALL',ownership='ALL',sortMode='DEFAULT',visibleRows=[];
function parseCSV(t){let rows=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c==='\"'&&n==='\"'){v+='\"';i++}else if(c==='\"')q=false;else v+=c}else{if(c==='\"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v);rows.push(row);row=[];v=''}else if(c!=='\r')v+=c}}row.push(v);rows.push(row);return rows}
function convert(t){const a=parseCSV(t);if(!a.length)return[];const h=a[0].map(x=>x.trim());const specialIndex=h.indexOf("절품 보유");let ni=h.findIndex(x=>/꽃|flower|name/i.test(x)),gi=h.findIndex(x=>/등급|grade|rarity/i.test(x)),si=h.findIndex(x=>/길\s*전\s*점수|길드\s*전\s*점수|guild.*score/i.test(x));if(ni<0)ni=0;if(gi<0)gi=1;return a.slice(1).filter(r=>r[ni]?.trim()).map((r,i)=>{const owners=[];r.forEach((x,j)=>{if(j===ni||j===gi||j===si||j===specialIndex)return;const value=String(x||'').trim();if(!value)return;if(/보유자|닉네임|owners?/i.test(h[j]||''))owners.push(...value.split(/[,，\n]/).map(v=>v.trim()).filter(Boolean));else owners.push(h[j])});const rawScore=si>=0?String(r[si]||'').trim():'';return{name:r[ni].trim(),grade:(r[gi]||'').trim().toUpperCase(),score:rawScore,specialOwners:(r[specialIndex]||"").trim(),owners:[...new Set(owners)],order:i}})}
function updateStats(){const total=ALL.length,owned=ALL.filter(x=>x.owners.length).length,rate=total?Math.round(owned/total*100):0;document.getElementById('total').textContent=total;document.getElementById('owned').textContent=owned;document.getElementById('rate').textContent=rate+'%';document.getElementById('totalBar').style.width='100%';document.getElementById('ownedBar').style.width=rate+'%'}
const GRADE_ORDER={UR:0,SSR:1,SR:2,R:3,N:4};
function filteredRows(){const q=norm(document.getElementById('q').value);let rows=ALL.filter(x=>(grade==='ALL'||x.grade===grade)&&(ownership==='ALL'||(ownership==='OWNED'?x.owners.length>0:x.owners.length===0))&&(!q||norm(x.name).includes(q)||x.owners.some(o=>norm(o).includes(q))));rows=[...rows].sort((a,b)=>sortMode==='KOREAN'?a.name.localeCompare(b.name,'ko'):(GRADE_ORDER[a.grade]??99)-(GRADE_ORDER[b.grade]??99)||a.name.localeCompare(b.name,'ko'));return rows}
function render(){const rows=filteredRows();visibleRows=rows;document.getElementById('count').textContent=rows.length+'종';const grid=document.getElementById('grid');if(!rows.length){grid.innerHTML='<div class="empty">조건에 맞는 꽃이 없습니다.</div>';return}grid.innerHTML=rows.map((x,i)=>{let src=IMG.get(norm(x.name)),own=x.owners.length;const listScore=x.score!==''?ESC(x.score)+'점':'-';return `<button class="card grade-${ESC(x.grade)}${own?'':' unowned'}" data-i="${i}">${src?`<img class="thumb" src="${ESC(src)}" alt="${ESC(x.name)}" loading="lazy">`:`<div class="thumb" style="display:grid;place-items:center;background:#f4eee4;color:#9b8b7b;font-weight:900">NO IMAGE</div>`}<div class="info" data-score="${listScore}"><h3>${ESC(x.name)}</h3><div class="meta"><span class="grade-badge grade-${ESC(x.grade)}">${ESC(x.grade||'-')}</span><strong>${own?own+'명':'미보유'}</strong></div></div></button>`}).join('');grid.querySelectorAll('.card').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.i)))}
function openDetail(i){const x=visibleRows[i];if(!x)return;currentIndex=i;const big=document.getElementById('big');big.src=IMG.get(norm(x.name))||'';big.style.display=IMG.get(norm(x.name))?'inline-block':'none';document.getElementById('flowerName').textContent=x.name;const g=document.getElementById('g');g.textContent=x.grade||'-';g.className='grade grade-'+(x.grade||'NA');const score=document.getElementById('score');if(x.score!==''){score.textContent='길전 '+x.score+'점';score.hidden=false}else{score.textContent='';score.hidden=true}document.getElementById('oc').textContent=renderFlowerOwners(document.getElementById('owners'),x.owners,x.specialOwners,'owner owner-link','owner-link-arrow')+'명';document.getElementById('sheet').showModal()}
let currentIndex=0;function moveDetail(step){if(!visibleRows.length)return;currentIndex=(currentIndex+step+visibleRows.length)%visibleRows.length;openDetail(currentIndex)}
function openFlowerFromUrl(){const name=new URLSearchParams(location.search).get('flower');if(!name)return;const index=visibleRows.findIndex(x=>norm(x.name)===norm(name));if(index>=0)requestAnimationFrame(()=>openDetail(index))}
async function load(){document.getElementById('grid').innerHTML='<div class="loading">Google 시트에서 데이터를 불러오는 중입니다…</div>';try{const r=await fetch(CSV+'&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);ALL=convert(await r.text());updateStats();render();openFlowerFromUrl()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div>'}}
function replaceBrokenImage(img){if(img.dataset.imageFallback==='1')return;img.dataset.imageFallback='1';if(img.id==='big'){img.removeAttribute('src');img.style.display='none';return}const missing=document.createElement('div');missing.className='thumb image-missing';missing.textContent='NO IMAGE';missing.setAttribute('role','img');missing.setAttribute('aria-label',(img.alt||'꽃 이미지')+' 이미지 준비 중');img.replaceWith(missing)}
document.addEventListener('error',e=>{const img=e.target;if(img instanceof HTMLImageElement&&(img.classList.contains('thumb')||img.id==='big'))replaceBrokenImage(img)},true);
const searchInput=document.getElementById('q'),searchClear=document.getElementById('searchClear');const syncSearchClear=()=>searchClear.classList.toggle('show',!!searchInput.value);searchInput.oninput=()=>{syncSearchClear();render()};searchClear.onclick=()=>{searchInput.value='';syncSearchClear();render();searchInput.focus()};syncSearchClear();document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-g]').forEach(x=>x.classList.remove('active'));b.classList.add('active');grade=b.dataset.g;render()});document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-o]').forEach(x=>x.classList.remove('active'));b.classList.add('active');ownership=b.dataset.o;render()});document.getElementById('sort').onchange=e=>{sortMode=e.target.value;render()};document.getElementById('refresh').onclick=load;document.getElementById('x').onclick=()=>document.getElementById('sheet').close();document.getElementById('prev').onclick=()=>moveDetail(-1);document.getElementById('next').onclick=()=>moveDetail(1);document.getElementById('sheet').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});load();
</script>
<script id="doguldan-admin-images">
(async()=>{try{const r=await fetch('./admin-flower-images.json?_='+Date.now(),{cache:'no-store'});if(!r.ok)return;const images=await r.json();Object.entries(images||{}).forEach(([name,path])=>IMG.set(norm(name),path));if(ALL.length)render()}catch(e){console.warn('admin flower images load failed',e)}})();
</script>
<script id="doguldan-view-mode">
(()=>{const grid=document.getElementById('grid');const buttons=[...document.querySelectorAll('.view-toggle [data-view]')];const KEY='dooduzViewMode';const apply=mode=>{const list=mode==='LIST';grid?.classList.toggle('text-view',list);buttons.forEach(btn=>{const on=btn.dataset.view===mode;btn.classList.toggle('active',on);btn.setAttribute('aria-pressed',on?'true':'false')});try{localStorage.setItem(KEY,mode)}catch(e){}};let saved='CARD';try{saved=localStorage.getItem(KEY)==='LIST'?'LIST':'CARD'}catch(e){}apply(saved);buttons.forEach(btn=>btn.addEventListener('click',()=>apply(btn.dataset.view)));const topBtn=document.getElementById('dooduzTopBtn');const syncTop=()=>topBtn?.classList.toggle('show',window.scrollY>700);window.addEventListener('scroll',syncTop,{passive:true});topBtn?.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));syncTop();})();
</script>
</body></html>

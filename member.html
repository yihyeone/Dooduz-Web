<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8eb"><title>길드원 보유 꽃</title><style>:root{--paper:#fffdf8;--orange:#f4a51c;--brown:#6b421f;--muted:#8b7b6a;--line:#eadcc8;--green:#679c4a;--shadow:0 9px 24px rgba(88,55,21,.10)}*{box-sizing:border-box}body{margin:0;background:#f3eee6;color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.app{max-width:520px;min-height:100dvh;margin:auto;background:linear-gradient(#fffaf0,#fff6e5);padding:16px 15px 40px}.top{display:flex;align-items:center;gap:10px;padding:10px 0 14px}.back{border:1px solid var(--line);background:white;border-radius:99px;padding:9px 12px;color:var(--brown);font-weight:900}.title small{display:block;font-size:11px;color:var(--orange);font-weight:900}.title h1{font-size:21px;margin:3px 0 0}.summary{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.summary strong{font-size:25px}.summary span{font-size:11px;color:var(--muted);font-weight:800;margin-left:5px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{padding:6px 9px;border-radius:99px;background:#f6eee2;font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.thumb{width:100%;aspect-ratio:212/279;object-fit:cover;display:block;background:#f7f2ea}.info{padding:9px 10px 10px}.info h3{font-size:13px;margin:0 0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info b{font-size:11px;color:var(--muted)}.empty{grid-column:1/-1;padding:36px 18px;text-align:center;background:white;border:1px dashed var(--line);border-radius:17px;color:var(--muted)}</style></head><body><div class="app"><div class="top"><button class="back" onclick="history.back()">‹ 뒤로</button><div class="title"><small>두더지도굴단 · 길드원 도감</small><h1 id="name">길드원</h1></div></div><div class="summary"><strong id="count">-</strong><span>보유 꽃</span><div class="chips" id="chips"></div></div><div class="grid" id="grid"><div class="empty">보유 꽃을 불러오는 중입니다…</div></div></div><script>const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSighkaGKMuouQNsjGsanPYmZE9jJ03_mIqUJ4RnFPhr5LKKVwNf2ZrgFpRdPl1cSDn3s7t5xTOOyo0/pub?gid=129712828&single=true&output=csv';const who=new URLSearchParams(location.search).get('name')||'';document.getElementById('name').textContent=who||'길드원';function csv(t){let r=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);r.push(row);row=[];v=''}else v+=c}if(v.length||row.length){row.push(v);r.push(row)}return r}function own(s){return String(s||'').split(/[\n,;/·|]+/).map(x=>x.trim()).filter(Boolean)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{let res=await fetch(CSV+'&_='+Date.now(),{cache:'no-store'});let a=csv(await res.text()),h=a.shift().map(x=>x.trim());let ni=h.findIndex(x=>x.includes('꽃 이름')),gi=h.findIndex(x=>x.includes('등급')),oi=h.findIndex(x=>x.includes('보유자'));let rows=a.map(r=>({n:(r[ni]||'').trim(),g:(r[gi]||'').trim().toUpperCase(),o:own(r[oi])})).filter(x=>x.n&&x.o.includes(who));count.textContent=rows.length+'종';let grades={UR:0,SSR:0,SR:0,R:0,N:0};rows.forEach(x=>{if(grades[x.g]!=null)grades[x.g]++});chips.innerHTML=Object.entries(grades).map(([g,n])=>'<span class="chip">'+g+' '+n+'</span>').join('');if(!rows.length){grid.innerHTML='<div class="empty">등록된 보유 꽃이 없습니다.</div>';return}let app=await fetch('./app.html?v=20260815',{cache:'no-store'}).then(r=>r.text());let m=app.match(/const IMAGES=(\{.*?\});\nconst IMG/s);let imgs={};if(m){try{imgs=Function('return '+m[1])()}catch(e){}}grid.innerHTML=rows.map(x=>'<div class="card"><img class="thumb" src="'+(imgs[x.n]||'')+'" alt="'+esc(x.n)+'"><div class="info"><h3>'+esc(x.n)+'</h3><b>'+esc(x.g)+'</b></div></div>').join('')}catch(e){grid.innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'}}load();</script></body></html>

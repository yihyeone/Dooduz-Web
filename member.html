flower-owner-list.js"></script><script src="./guild-catalog-images.js?v=20260914"></script><script>const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSighkaGKMuouQNsjGsanPYmZE9jJ03_mIqUJ4RnFPhr5LKKVwNf2ZrgFpRdPl1cSDn3s7t5xTOOyo0/pub?gid=129712828&single=true&output=csv';const who=new URLSearchParams(location.search).get('name')||'';document.getElementById('name').textContent=who||'길드원';const IMAGES=window.GUILD_CATALOG_IMAGES||{};const norm=s=>String(s||'').replace(/[\s·ㆍ•・]/g,'').toLowerCase();const IMAGE_MAP=new Map(Object.entries(IMAGES).map(([k,v])=>[norm(k),v]));document.addEventListener('error',e=>{const img=e.target;if(img instanceof HTMLImageElement&&img.id==='flowerImage'){img.removeAttribute('src');img.style.display='none'}},true);let allRows=[],visibleRows=[],activeGrade='ALL',memberQuery='';function csv(t){let r=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);r.push(row);row=[];v=''}else v+=c}if(v.length||row.length){row.push(v);r.push(row)}return r}function own(s){return String(s||'').split(/[\n,;/·|]+/).map(x=>x.trim()).filter(Boolean)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openFlower(i){const x=visibleRows[i];if(!x)return;const src=IMAGE_MAP.get(norm(x.n))||'';flowerImage.src=src;flowerImage.alt=x.n;flowerImage.style.display=src?'inline-block':'none';flowerTitle.textContent=x.n;flowerGrade.textContent=x.g||'-';renderFlowerOwners(flowerOwners,x.o,x.specialOwners,'flower-owner','flower-owner-arrow');flowerSheet.showModal()}function render(){const z=memberQuery.trim().toLowerCase();const graded=activeGrade==='ALL'?allRows:allRows.filter(x=>x.g===activeGrade);const rows=z?graded.filter(x=>x.n.toLowerCase().includes(z)):graded;visibleRows=rows;resultNote.textContent=(activeGrade!=='ALL'||z)?'검색 결과 '+rows.length+'종':'';if(!rows.length){list.innerHTML='<div class="empty">조건에 맞는 보유 꽃이 없습니다.</div>';return}list.innerHTML=rows.map((x,i)=>'<button class="row" type="button" data-i="'+i+'" aria-label="'+esc(x.n)+' 상세 보기"><span class="grade grade-'+esc(x.g)+'">'+esc(x.g)+'</span><span class="flower">'+esc(x.n)+'</span><span class="row-arrow" aria-hidden="true">›</span></button>').join('');list.querySelectorAll('.row').forEach(b=>b.onclick=()=>openFlower(Number(b.dataset.i)))} function setGrade(g){activeGrade=g;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.g===g));render()}memberQ.oninput=e=>{memberQuery=e.target.value;render()};clearQ.onclick=()=>{memberQ.value='';memberQuery='';memberQ.focus();render()};closeFlower.onclick=()=>flowerSheet.close();flowerSheet.addEventListener('click',e=>{if(e.target===flowerSheet)flowerSheet.close()});async function load(){try{let res=await fetch(CSV+'&_='+Date.now(),{cache:'no-store'});let a=csv(await res.text()),h=a.shift().map(x=>x.trim());let ni=h.findIndex(x=>x.includes('꽃 이름')),gi=h.findIndex(x=>x.includes('등급')),oi=h.findIndex(x=>x.includes('보유자'));const specialIndex=h.indexOf('절품 보유');allRows=a.map(r=>({specialOwners:(r[specialIndex]||'').trim(),n:(r[ni]||'').trim(),g:(r[gi]||'').trim().toUpperCase(),o:own(r[oi])})).filter(x=>x.n&&x.o.includes(who));const order={UR:0,SSR:1,SR:2,R:3,N:4};allRows.sort((a,b)=>(order[a.g]??9)-(order[b.g]??9)||a.n.localeCompare(b.n,'ko'));count.textContent=allRows.length+'종';let grades={UR:0,SSR:0,SR:0,R:0,N:0};allRows.forEach(x=>{if(grades[x.g]!=null)grades[x.g]++});chips.innerHTML='<button class="chip active" data-g="ALL">전체 '+allRows.length+'</button>'+Object.entries(grades).map(([g,n])=>'<button class="chip" data-g="'+g+'">'+g+' '+n+'</button>').join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>setGrade(b.dataset.g));if(!allRows.length){list.innerHTML='<div class="empty">등록된 보유 꽃이 없습니다.</div>';return}render()}catch(e){list.innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'}}load();</script></body></html>

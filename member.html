<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8eb"><title>길드원 보유 꽃</title><style>:root{--paper:#fffdf8;--orange:#f4a51c;--brown:#6b421f;--muted:#8b7b6a;--line:#eadcc8;--green:#679c4a;--shadow:0 9px 24px rgba(88,55,21,.10)}*{box-sizing:border-box}body{margin:0;background:#f3eee6;color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}.app{max-width:520px;min-height:100dvh;margin:auto;background:linear-gradient(#fffaf0,#fff6e5);padding:16px 15px 40px}.top{display:flex;align-items:center;gap:10px;padding:10px 0 14px}.back{border:1px solid var(--line);background:white;border-radius:99px;padding:9px 12px;color:var(--brown);font-weight:900}.title small{display:block;font-size:11px;color:var(--orange);font-weight:900}.title h1{font-size:21px;margin:3px 0 0}.member-sticky{position:sticky;top:0;z-index:10;margin:0 -15px;padding:calc(env(safe-area-inset-top,0px) + 4px) 15px 1px;background:linear-gradient(#fffaf0 82%,rgba(255,250,240,.96))}.summary{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.summary strong{font-size:25px}.summary span{font-size:11px;color:var(--muted);font-weight:800;margin-left:5px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{border:1px solid transparent;padding:6px 9px;border-radius:99px;background:#f6eee2;font-size:11px;font-weight:900;color:var(--brown);cursor:pointer}.chip.active{background:var(--brown);color:white;border-color:var(--brown)}.list{background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow)}.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.grade{width:42px;flex:none;text-align:center;padding:5px 0;border-radius:999px;background:#f6eee2;font-size:11px;font-weight:950;color:var(--brown)}.flower{min-width:0;font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:36px 18px;text-align:center;background:white;border:1px dashed var(--line);border-radius:17px;color:var(--muted)}.member-search{position:relative;margin-top:10px}.member-search input{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;background:#fffaf3;padding:0 36px 0 12px;color:var(--brown);font-size:13px;font-weight:750;outline:0}.member-search input:focus{border-color:#d9aa55;box-shadow:0 0 0 3px rgba(244,165,28,.14)}.member-search button{position:absolute;right:5px;top:5px;width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:18px}.row{text-decoration:none;color:inherit;cursor:pointer}.row:hover,.row:focus-visible{background:#fff8eb;outline:0}.row-arrow{margin-left:auto;color:var(--muted);font-size:20px}.result-note{font-size:11px;color:var(--muted);font-weight:800;margin:8px 2px 0}
.chip[data-g="UR"],.chip[data-g="UR"].active,.grade.grade-UR{background:#fde7ef!important;border-color:#f3b3c8!important;color:#ad4f72!important}.chip[data-g="SSR"],.chip[data-g="SSR"].active,.grade.grade-SSR{background:#fff2c9!important;border-color:#e9c65e!important;color:#876417!important}.chip[data-g="SR"],.chip[data-g="SR"].active,.grade.grade-SR{background:#eee4fa!important;border-color:#c7a7e7!important;color:#6e4b9e!important}.chip[data-g="R"],.chip[data-g="R"].active,.grade.grade-R{background:#e1f1fb!important;border-color:#9bc9e5!important;color:#37749a!important}.chip[data-g="N"],.chip[data-g="N"].active,.grade.grade-N{background:#e5f3df!important;border-color:#acd099!important;color:#4f7b3e!important}.grade[class*="grade-"]{border:1px solid transparent}.chip[data-g]:not([data-g="ALL"]){border-style:solid!important;border-width:1px!important}.chip[data-g].active:not([data-g="ALL"]){box-shadow:inset 0 0 0 1.5px currentColor,0 2px 7px rgba(75,52,31,.10)}
</style></head><body><div class="app"><div class="member-sticky"><div class="top"><button class="back" onclick="history.back()">‹ 뒤로</button><div class="title"><small>두더지도굴단 · 길드원 도감</small><h1 id="name">길드원</h1></div></div><div class="summary"><strong id="count">-</strong><span>보유 꽃</span><div class="member-search"><input id="memberQ" type="search" placeholder="이 길드원의 꽃 검색" autocomplete="off"><button id="clearQ" type="button" aria-label="검색어 지우기">×</button></div><div class="chips" id="chips"></div><div class="result-note" id="resultNote"></div></div></div><div class="list" id="list"><div class="empty">보유 꽃을 불러오는 중입니다…</div></div></div><script>const CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSighkaGKMuouQNsjGsanPYmZE9jJ03_mIqUJ4RnFPhr5LKKVwNf2ZrgFpRdPl1cSDn3s7t5xTOOyo0/pub?gid=129712828&single=true&output=csv';const who=new URLSearchParams(location.search).get('name')||'';document.getElementById('name').textContent=who||'길드원';let allRows=[],activeGrade='ALL',memberQuery='';function csv(t){let r=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(c==='"'&&q&&n==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);r.push(row);row=[];v=''}else v+=c}if(v.length||row.length){row.push(v);r.push(row)}return r}function own(s){return String(s||'').split(/[\n,;/·|]+/).map(x=>x.trim()).filter(Boolean)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const z=memberQuery.trim().toLowerCase();const graded=activeGrade==='ALL'?allRows:allRows.filter(x=>x.g===activeGrade);const rows=z?graded.filter(x=>x.n.toLowerCase().includes(z)):graded;resultNote.textContent=(activeGrade!=='ALL'||z)?'검색 결과 '+rows.length+'종':'';if(!rows.length){list.innerHTML='<div class="empty">조건에 맞는 보유 꽃이 없습니다.</div>';return}list.innerHTML=rows.map(x=>'<a class="row" href="index.html?flower='+encodeURIComponent(x.n)+'"><span class="grade grade-'+esc(x.g)+'">'+esc(x.g)+'</span><span class="flower">'+esc(x.n)+'</span><span class="row-arrow" aria-hidden="true">›</span></a>').join('')}function setGrade(g){activeGrade=g;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('active',b.dataset.g===g));render()}memberQ.oninput=e=>{memberQuery=e.target.value;render()};clearQ.onclick=()=>{memberQ.value='';memberQuery='';memberQ.focus();render()};async function load(){try{let res=await fetch(CSV+'&_='+Date.now(),{cache:'no-store'});let a=csv(await res.text()),h=a.shift().map(x=>x.trim());let ni=h.findIndex(x=>x.includes('꽃 이름')),gi=h.findIndex(x=>x.includes('등급')),oi=h.findIndex(x=>x.includes('보유자'));allRows=a.map(r=>({n:(r[ni]||'').trim(),g:(r[gi]||'').trim().toUpperCase(),o:own(r[oi])})).filter(x=>x.n&&x.o.includes(who));const order={UR:0,SSR:1,SR:2,R:3,N:4};allRows.sort((a,b)=>(order[a.g]??9)-(order[b.g]??9)||a.n.localeCompare(b.n,'ko'));count.textContent=allRows.length+'종';let grades={UR:0,SSR:0,SR:0,R:0,N:0};allRows.forEach(x=>{if(grades[x.g]!=null)grades[x.g]++});chips.innerHTML='<button class="chip active" data-g="ALL">전체 '+allRows.length+'</button>'+Object.entries(grades).map(([g,n])=>'<button class="chip" data-g="'+g+'">'+g+' '+n+'</button>').join('');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>setGrade(b.dataset.g));if(!allRows.length){list.innerHTML='<div class="empty">등록된 보유 꽃이 없습니다.</div>';return}render()}catch(e){list.innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'}}load();</script></body></html>

function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell='';}else cell+=c;}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows;}
function normalizeName(s){return String(s||'').trim().replace(/\s+/g,' ')}
function status(x){if(x.holderNames.length===0)return 'delete';if(x.score<=DELETE_MAX)return 'delete';if(x.score>=HIGH_SCORE)return 'high';return 'keep'}
function label(s){return s==='delete'?'삭제':s==='high'?'고득점':'유지'}
function cls(s){return s==='delete'?'delete':s==='high'?'highTag':'keep'}
function thumbHTML(x){return x.thumb?`<img class="thumb" src="${x.thumb}" alt="${x.name} 길전 임무 썸네일">`:'<span class="thumb none" aria-label="임무 캡처 없음">—</span>'}
function render(){let rows=[...DATA];const sort=document.querySelector('#sort').value;rows.sort(sort==='score'?(a,b)=>b.score-a.score||a.name.localeCompare(b.name,'ko'):sort==='holders'?(a,b)=>a.holderNames.length-b.holderNames.length||b.score-a.score:(a,b)=>a.name.localeCompare(b.name,'ko'));rows=rows.filter(x=>filter==='all'||(filter==='high'&&status(x)==='high')||(filter==='keep'&&status(x)==='keep')||(filter==='delete'&&status(x)==='delete')||(filter==='zero'&&x.holderNames.length===0)||(filter==='one'&&x.holderNames.length===1));const t=document.querySelector('#table');t.innerHTML='<div class="tr th"><div>꽃</div><div style="text-align:center">점수</div><div style="text-align:center">보유</div><div style="text-align:center">판단</div></div>'+(rows.length?rows.map(x=>{const s=status(x),n=x.holderNames.length;return `<div class="tr"><div class="flowercell">${thumbHTML(x)}<div class="name">${x.name}</div></div><div class="score ${s==='high'?'high':''}">${x.score}</div><button class="holders ${n===0?'zero':''}" data-holder>${n}명</button><div class="judge ${cls(s)}">${label(s)}</div><div class="detail">${n?'<b>보유자</b> · '+x.holderNames.join(' · '):'<b>보유자 없음 · 삭제 대상</b>'}${x.harvest?`<br>실측 임무 · ${x.harvest}송이 수확`:''}</div></div>`}).join(''):'<div class="empty">해당 조건의 꽃이 없습니다.</div>');document.querySelectorAll('[data-holder]').forEach(b=>b.onclick=()=>b.closest('.tr').classList.toggle('open'));document.querySelector('#total').textContent=DATA.length;document.querySelector('#high').textContent=DATA.filter(x=>status(x)==='high').length;document.querySelector('#del').textContent=DATA.filter(x=>status(x)==='delete').length;}
async function loadHolders(){const sync=document.querySelector('#sync');try{const res=await fetch(SHEET_CSV+'&_='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const rows=parseCSV(await res.text());if(rows.length<2)throw new Error('empty sheet');const header=rows[0].map(normalizeName);const nameIdx=header.findIndex(x=>x==='꽃 이름'||x==='꽃이름');const holderIdx=header.findIndex(x=>x==='보유자 닉네임'||x.includes('보유자'));if(nameIdx<0||holderIdx<0)throw new Error('column mismatch');const map=new Map();rows.slice(1).forEach(r=>{const name=normalizeName(r[nameIdx]);if(!name)return;const holders=String(r[holderIdx]||'').split(',').map(normalizeName).filter(Boolean);map.set(name,holders);});DATA=BASE_DATA.map(x=>({...x,holderNames:map.get(normalizeName(x.name))||[]}));sync.textContent=`꽃 보유현황 연동 완료 · ${map.size}종 기준`;sync.className='sync ok';}catch(e){console.error(e);sync.textContent='보유현황 연동 실패 · 임시 데이터로 표시 중';sync.className='sync err';}render();}
document.querySelector('#filters').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));render()};document.querySelector('#sort').onchange=render;loadHolders();
</script></body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>두더지도굴단 꽃 도감</title>
<style>
:root{--cream:#fff8eb;--paper:#fffdf8;--orange:#f5a623;--brown:#6f421d;--muted:#8c7b69;--line:#eadbc3;--green:#6fa94f;--shadow:0 10px 28px rgba(100,65,25,.10)}
*{box-sizing:border-box}body{margin:0;background:#f4eee5;color:var(--brown);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}
button,input{font:inherit}.app{max-width:520px;min-height:100dvh;margin:0 auto;background:linear-gradient(180deg,#fffaf0 0%,#fff7e7 100%);padding:16px 16px 78px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 14px}.brand small{display:block;color:var(--orange);font-weight:900;letter-spacing:.08em;font-size:11px}.brand h1{margin:3px 0 0;font-size:23px}
.refresh{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 12px;color:var(--brown);font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.stat span{font-size:12px;color:var(--muted);font-weight:800}.stat strong{display:block;font-size:27px;margin-top:3px}.stat small{color:var(--muted)}
.tools{position:sticky;top:0;z-index:5;padding:8px 0 11px;background:linear-gradient(var(--cream) 80%,transparent)}.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:17px;height:50px;padding:0 14px;box-shadow:var(--shadow)}.search span{font-size:24px;color:var(--orange)}.search input{flex:1;border:0;outline:0;background:transparent;color:var(--brown);font-size:15px}
.filters{display:flex;gap:7px;overflow:auto;padding-top:9px}.filters button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 13px;color:var(--muted);font-weight:900;white-space:nowrap}.filters button.active{background:var(--brown);border-color:var(--brown);color:#fff}
.head{display:flex;justify-content:space-between;align-items:end;margin:7px 2px 11px}.head h2{margin:0;font-size:19px}.head p{margin:4px 0 0;color:var(--muted);font-size:12px}.head b{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:0;overflow:hidden;text-align:left;box-shadow:var(--shadow)}.visual{height:112px;display:flex;align-items:center;justify-content:center;position:relative}.visual::after{content:"✿";font-size:47px}.visual.UR{background:#f7d1dc}.visual.SSR{background:#f8e7a8}.visual.SR{background:#dfd0ee}.visual.R{background:#c9e7f5}.visual.N{background:#d7ebcb}.grade{position:absolute;left:9px;top:9px;background:#fff;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:900}.info{padding:11px}.info h3{font-size:14px;margin:0 0 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.owner-summary{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:800}.owner-summary strong{color:var(--green)}
.loading,.empty{grid-column:1/-1;background:var(--paper);border:1px dashed var(--line);border-radius:18px;padding:35px 18px;text-align:center;color:var(--muted)}
.sheet{width:min(520px,100%);max-width:none;margin:auto auto 0;border:0;border-radius:26px 26px 0 0;background:var(--paper);padding:15px 16px 22px;color:var(--brown)}.sheet::backdrop{background:rgba(48,30,15,.48)}.handle{width:46px;height:5px;background:#e3d6c5;border-radius:999px;margin:0 auto 11px}.close{position:absolute;right:14px;top:13px;width:38px;height:38px;border:0;border-radius:50%;background:#6f421d;color:white;font-size:25px}.sheet-visual{height:190px;border-radius:19px;display:flex;align-items:center;justify-content:center;margin-top:8px}.sheet-visual::after{content:"✿";font-size:78px}.sheet h3{font-size:23px;margin:15px 0 5px}.grade-line{font-weight:900;font-size:12px;color:var(--muted)}.owner-title{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:15px;margin-top:16px;font-weight:900}.owners{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.owner{background:#edf5e8;color:#4b773b;border-radius:999px;padding:8px 11px;font-size:13px;font-weight:900}.owner.none{background:#f0ebe5;color:var(--muted)}
.footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:rgba(255,253,248,.96);border-top:1px solid var(--line);padding:12px 18px;text-align:center;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><small>더 코지 플로리스트 · 길드 전용</small><h1>두더지도굴단 꽃 도감 🌱</h1></div><button class="refresh" id="refreshBtn">↻ 새로고침</button></header>
<section class="stats"><div class="stat"><span>전체 꽃</span><strong id="totalFlowers">-</strong><small>등록된 도감</small></div><div class="stat"><span>길드 보유</span><strong id="guildOwned">-</strong><small id="guildPercent">보유율 -</small></div></section>
<section class="tools"><label class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="꽃 이름 또는 보유자 검색"></label><div class="filters" id="filters"><button class="active" data-grade="ALL">전체</button><button data-grade="UR">UR</button><button data-grade="SSR">SSR</button><button data-grade="SR">SR</button><button data-grade="R">R</button><button data-grade="N">N</button></div></section>
<div class="head"><div><h2>길드 보유현황</h2><p>꽃을 누르면 보유 길드원을 확인할 수 있습니다.</p></div><b id="resultCount"></b></div>
<div class="grid" id="grid"><div class="loading">Google 시트에서 데이터를 불러오는 중입니다…</div></div>
</div>
<dialog class="sheet" id="sheet"><div class="handle"></div><button class="close" id="closeSheet">×</button><div class="sheet-visual" id="sheetVisual"></div><h3 id="sheetName"></h3><div class="grade-line" id="sheetGrade"></div><div class="owner-title"><span>보유 길드원</span><b id="sheetOwnerCount"></b></div><div class="owners" id="owners"></div></dialog>
<div class="footer">Google Sheets 데이터 기준 · 웹에서는 조회만 가능합니다.</div>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSighkaGKMuouQNsjGsanPYmZE9jJ03_mIqUJ4RnFPhr5LKKVwNf2ZrgFpRdPl1cSDn3s7t5xTOOyo0/pub?gid=129712828&single=true&output=csv";
let flowers=[], grade="ALL", query="";
function parseCSV(text){const rows=[];let row=[],value="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quoted&&n==='"'){value+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(value);value="";}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(value);value="";if(row.some(x=>x!==""))rows.push(row);row=[];}else value+=c;}if(value.length||row.length){row.push(value);rows.push(row);}return rows;}
function normalizeGrade(v){v=(v||"").trim().toUpperCase();return ["UR","SSR","SR","R","N"].includes(v)?v:"N";}
function parseOwners(v){return (v||"").split(/[,/\n·|]+/).map(x=>x.trim()).filter(Boolean);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadData(){document.getElementById("grid").innerHTML='<div class="loading">Google 시트에서 데이터를 불러오는 중입니다…</div>';try{const res=await fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);const rows=parseCSV(await res.text());const headers=rows.shift().map(x=>x.trim());const ni=headers.findIndex(h=>h.includes("꽃 이름")),gi=headers.findIndex(h=>h.includes("등급")),oi=headers.findIndex(h=>h.includes("보유자"));if(ni<0||gi<0||oi<0)throw new Error("열 이름 확인 필요");flowers=rows.map((r,i)=>({id:i+1,name:(r[ni]||"").trim(),grade:normalizeGrade(r[gi]),owners:parseOwners(r[oi])})).filter(f=>f.name);updateStats();render();}catch(e){document.getElementById("grid").innerHTML='<div class="empty">시트 데이터를 불러오지 못했습니다.<br>웹 게시 설정과 CSV 링크를 확인해주세요.</div>';}}
function updateStats(){const total=flowers.length,owned=flowers.filter(f=>f.owners.length>0).length;document.getElementById("totalFlowers").textContent=total+"종";document.getElementById("guildOwned").textContent=owned+"종";document.getElementById("guildPercent").textContent=total?"보유율 "+(owned/total*100).toFixed(1)+"%":"보유율 -";}
function filtered(){const q=query.toLowerCase().trim();return flowers.filter(f=>(grade==="ALL"||f.grade===grade)&&(!q||f.name.toLowerCase().includes(q)||f.owners.some(o=>o.toLowerCase().includes(q))));}
function render(){const list=filtered();document.getElementById("resultCount").textContent=list.length+"종";const grid=document.getElementById("grid");if(!list.length){grid.innerHTML='<div class="empty">조건에 맞는 꽃이 없습니다.</div>';return;}grid.innerHTML=list.map(f=>`<button class="card" data-id="${f.id}"><div class="visual ${f.grade}"><span class="grade">${f.grade}</span></div><div class="info"><h3>${escapeHtml(f.name)}</h3><div class="owner-summary"><span>보유 길드원</span><strong>${f.owners.length?f.owners.length+"명":"미보유"}</strong></div></div></button>`).join("");document.querySelectorAll(".card").forEach(b=>b.onclick=()=>openFlower(+b.dataset.id));}
function openFlower(id){const f=flowers.find(x=>x.id===id);if(!f)return;document.getElementById("sheetVisual").className="sheet-visual "+f.grade;document.getElementById("sheetName").textContent=f.name;document.getElementById("sheetGrade").textContent=f.grade;document.getElementById("sheetOwnerCount").textContent=f.owners.length+"명";document.getElementById("owners").innerHTML=f.owners.length?f.owners.map(o=>`<span class="owner">${escapeHtml(o)}</span>`).join(""):'<span class="owner none">현재 등록된 보유자가 없습니다.</span>';document.getElementById("sheet").showModal();}
document.getElementById("closeSheet").onclick=()=>document.getElementById("sheet").close();
document.getElementById("sheet").addEventListener("click",e=>{if(e.target===document.getElementById("sheet"))document.getElementById("sheet").close();});
document.getElementById("searchInput").oninput=e=>{query=e.target.value;render();};
document.querySelectorAll("#filters button").forEach(b=>b.onclick=()=>{grade=b.dataset.grade;document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("active",x===b));render();});
document.getElementById("refreshBtn").onclick=loadData;
loadData();
</script>
</body></html>

    const html=`<div class="top3bar" id="top3bar"><div class="top3-title">🏆 SR이상 수집왕 TOP 3</div><div class="top3-list" id="top3list"><span class="top3-empty">집계 중…</span></div></div>`;
    const fn=`function renderTop3(){
 const box=document.getElementById('top3list');if(!box)return;
 const m=new Map(),highGrades=new Set(['UR','SSR','SR']);
 flowers.filter(f=>highGrades.has(f.g)).forEach(f=>f.o.forEach(n=>{if(!m.has(n))m.set(n,{name:n,total:0,grades:{UR:0,SSR:0,SR:0}});let v=m.get(n);v.total++;if(v.grades[f.g]!=null)v.grades[f.g]++}));
 const a=[...m.values()].sort((a,b)=>b.total-a.total||b.grades.UR-a.grades.UR||b.grades.SSR-a.grades.SSR||b.grades.SR-a.grades.SR||a.name.localeCompare(b.name,'ko')).slice(0,3);
 if(!a.length){box.innerHTML='<span class="top3-empty">SR이상 보유자 데이터 없음</span>';return}
 const medal=['🥇','🥈','🥉'];box.innerHTML=a.map((x,i)=>'<a class="top3-item" href="member.html?name='+encodeURIComponent(x.name)+'"><span class="top3-rank">'+medal[i]+'</span><span class="top3-name">'+esc(x.name)+'</span><span class="top3-count">'+x.total+'종</span></a>').join('');
}
`;

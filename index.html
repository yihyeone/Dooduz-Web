<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>두더지도굴단 꽃 도감</title></head><body><script>
(async()=>{
  try{
    let s=await fetch('./app.html?v=20260815',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});
    const css=`<style id="top3-style">
.top3bar{margin:10px 0 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:46px;padding:9px 11px;display:flex;align-items:center;gap:8px;overflow:hidden}.top3-title{font-size:11px;font-weight:950;white-space:nowrap;color:var(--brown);flex:none}.top3-list{display:flex;align-items:center;gap:5px;min-width:0;flex:1;overflow:hidden}.top3-item{display:flex;align-items:center;gap:3px;min-width:0;flex:1;padding-left:6px;border-left:1px solid var(--line);font-size:10px;white-space:nowrap;text-decoration:none;color:inherit}.top3-item:first-child{border-left:0;padding-left:0}.top3-rank{font-size:13px;flex:none}.top3-name{font-weight:900;overflow:hidden;text-overflow:ellipsis;min-width:0;text-decoration:underline;text-underline-offset:2px}.top3-count{font-weight:950;color:var(--green);flex:none}.top3-empty{font-size:10px;color:var(--muted);font-weight:800}@media(max-width:390px){.top3bar{gap:6px;padding:8px 9px}.top3-title{font-size:10px}.top3-item{font-size:9px;padding-left:4px;gap:2px}.top3-rank{font-size:12px}}
</style>`;
    const html=`<div class="top3bar" id="top3bar"><div class="top3-title">🏆 SR이상 수집왕 TOP 3</div><div class="top3-list" id="top3list"><span class="top3-empty">집계 중…</span></div></div>`;
    const fn=`function renderTop3(){
 const box=document.getElementById('top3list');if(!box)return;
 const m=new Map(),highGrades=new Set(['UR','SSR','SR']);
 flowers.filter(f=>highGrades.has(f.g)).forEach(f=>f.o.forEach(n=>{if(!m.has(n))m.set(n,{name:n,total:0,grades:{UR:0,SSR:0,SR:0}});let v=m.get(n);v.total++;if(v.grades[f.g]!=null)v.grades[f.g]++}));
 const a=[...m.values()].sort((a,b)=>b.total-a.total||b.grades.UR-a.grades.UR||b.grades.SSR-a.grades.SSR||b.grades.SR-a.grades.SR||a.name.localeCompare(b.name,'ko')).slice(0,3);
 if(!a.length){box.innerHTML='<span class="top3-empty">SR이상 보유자 데이터 없음</span>';return}
 const medal=['🥇','🥈','🥉'];box.innerHTML=a.map((x,i)=>'<a class="top3-item" href="member.html?name='+encodeURIComponent(x.name)+'"><span class="top3-rank">'+medal[i]+'</span><span class="top3-name">'+esc(x.name)+'</span><span class="top3-count">'+x.total+'종</span></a>').join('');
}
`;
    s=s.replace('</head>',css+'</head>');
    s=s.replace('<div class="tools">',html+'<div class="tools">');
    s=s.replace('async function load(){',fn+'async function load(){');
    s=s.replace('ownedBar.style.width=p+"%";render()','ownedBar.style.width=p+"%";render();renderTop3()');
    document.open();document.write(s);document.close();
  }catch(e){document.body.innerHTML='<div style="font-family:sans-serif;padding:30px">페이지를 불러오지 못했습니다. 새로고침해주세요.</div>'}
})();
</script></body></html>

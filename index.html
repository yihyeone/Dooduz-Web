.stats{display:block!important}.guild-stat{padding:14px 15px 15px!important}.guild-stat-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.guild-stat-head span{font-size:12px!important}.guild-rate{font-size:21px!important;color:var(--green);margin:0!important}.guild-count{display:flex;align-items:baseline;gap:6px;margin-top:3px}.guild-count #owned{display:inline;margin:0;font-size:27px}.guild-count span{font-size:12px!important}.guild-count b{color:var(--brown);font-size:12px}.guild-stat .progress{height:10px;margin-top:10px}.guild-stat #totalBar{display:none}
</style>`;
    const html=`<div class="top3bar" id="top3bar"><div class="top3-title">🏆 SR이상 수집왕 TOP 3</div><div class="top3-list" id="top3list"><span class="top3-empty">집계 중…</span></div></div>`;
    const fn=`function renderTop3(){
 const box=document.getElementById('top3list');if(!box)return;
 const m=new Map(),highGrades=new Set(['UR','SSR','SR']);
 flowers.filter(f=>highGrades.has(f.g)).forEach(f=>f.o.forEach(n=>{if(!m.has(n))m.set(n,{name:n,total:0,grades:{UR:0,SSR:0,SR:0}});let v=m.get(n);v.total++;if(v.grades[f.g]!=null)v.grades[f.g]++}));
 const a=[...m.values()].sort((a,b)=>b.total-a.total||b.grades.UR-a.grades.UR||b.grades.SSR-a.grades.SSR||b.grades.SR-a.grades.SR||a.name.localeCompare(b.name,'ko')).slice(0,3);
 if(!a.length){box.innerHTML='<span class="top3-empty">SR이상 보유자 데이터 없음</span>';return}
 const medal=['🥇','🥈','🥉'];box.innerHTML=a.map((x,i)=>'<a class="top3-item" href="member.html?name='+encodeURIComponent(x.name)+'"><span class="top3-rank">'+medal[i]+'</span><span class="top3-name">'+esc(x.name)+'</span><span class="top3-count">'+x.total+'종</span></a>').join('');
}
`;
    const oldStats=`<div class="stats"><div class="stat"><span>전체 꽃</span><div class="stat-top"><strong id="total">-</strong><small class="stat-percent">100%</small></div><div class="progress"><i id="totalBar"></i></div></div><div class="stat"><span>길드 보유</span><div class="stat-top"><strong id="owned">-</strong><small class="stat-percent" id="rate">-</small></div><div class="progress"><i id="ownedBar"></i></div></div></div>`;
    const newStats=`<div class="stats"><div class="stat guild-stat"><div class="guild-stat-head"><span>길드 도감 완성도</span><strong class="guild-rate" id="rate">-</strong></div><div class="guild-count"><strong id="owned">-</strong><span>/ 전체 <b id="total">-</b></span></div><div class="progress"><i id="ownedBar"></i></div><i id="totalBar" hidden></i></div></div>`;
    s=s.replace(oldStats,newStats);
    s=s.replace('</head>',css+'</head>');
    s=s.replace('<div class="tools">',html+'<div class="tools">');
    s=s.replace('async function load(){',fn+'async function load(){');
    s=s.replace('ownedBar.style.width=p+"%";render()','ownedBar.style.width=p+"%";render();renderTop3()');
    document.open();document.write(s);document.close();
  }catch(e){document.body.innerHTML='<div style="font-family:sans-serif;padding:30px">페이지를 불러오지 못했습니다. 새로고침해주세요.</div>'}
})();
</script></body></html>

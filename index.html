<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>두더지도굴단 꽃 도감</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3eee6}#appframe{display:block;border:0;width:100vw;height:100dvh}</style></head><body><iframe id="appframe" src="legacy.html"></iframe><script>
const frame=document.getElementById('appframe');
frame.addEventListener('load',()=>{
 const w=frame.contentWindow,d=frame.contentDocument;
 const style=d.createElement('style');
 style.textContent=`
 .stats{gap:8px!important}.stat{padding:13px!important}.stat strong{font-size:23px!important;margin:2px 0 7px!important}.stat-progress{height:7px;background:#eee2d2;border-radius:999px;overflow:hidden;margin:4px 0 6px}.stat-progress>i{display:block;height:100%;background:#f4a51c;border-radius:999px}.stat-progress.green>i{background:#78a956}.stat-pct{font-size:11px;font-weight:900;color:#7a6b5d;display:flex;justify-content:space-between}
 .tools{padding-bottom:8px!important}.filters{display:none!important}.compact-controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}.compact-control{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:5px 7px;min-width:0}.compact-control span{font-size:9px;font-weight:900;color:var(--muted);white-space:nowrap}.compact-control select{width:100%;min-width:0;border:0;background:transparent;color:var(--brown);font-size:11px;font-weight:900;outline:0;padding:0}
 .sheet{position:relative!important;margin:7vh auto auto!important;width:min(470px,94%)!important;border-radius:24px!important;padding:16px 18px 22px!important;max-height:78dvh!important;overflow:auto!important}.sheet img{width:27%!important;height:auto!important;max-height:115px!important;object-fit:contain!important;display:block!important;margin:2px auto 8px!important;border-radius:12px!important}.sheet h3{font-size:22px!important;line-height:1.25!important;margin:10px 42px 4px!important;text-align:center!important}.sheet .grade{font-size:12px!important;text-align:center!important}.owner-title{margin-top:13px!important;padding-top:12px!important}.owners{margin-top:10px!important;gap:7px!important}.owner{font-size:13px!important;padding:8px 10px!important}.close{right:12px!important;top:11px!important;width:40px!important;height:40px!important;font-size:26px!important}.nav-arrow{position:absolute;top:78px;width:38px;height:38px;border:1px solid #e7dac8;border-radius:50%;background:#fff;color:#6b421f;font-size:24px;font-weight:900;box-shadow:0 4px 12px rgba(80,50,20,.12);z-index:4}.nav-arrow.prev{left:14px}.nav-arrow.next{right:14px}.nav-arrow:disabled{opacity:.25}.sheet::backdrop{background:rgba(47,31,18,.52)!important}
 `;
 d.head.appendChild(style);
 const stats=d.querySelectorAll('.stat');
 if(stats.length>=2){
   stats[0].querySelector('span').textContent='전체 도감';
   const p0=d.createElement('div');p0.innerHTML='<div class="stat-progress"><i style="width:100%"></i></div><div class="stat-pct"><span>도감 기준</span><b>100%</b></div>';stats[0].appendChild(p0);
   const p1=d.createElement('div');p1.id='ownedProgress';p1.innerHTML='<div class="stat-progress green"><i style="width:0%"></i></div><div class="stat-pct"><span>완성도</span><b>0%</b></div>';stats[1].appendChild(p1);
   const sync=()=>{const rate=d.getElementById('rate')?.textContent||'';const m=rate.match(/([0-9.]+)%/);const pct=m?Math.max(0,Math.min(100,parseFloat(m[1]))):0;const box=d.getElementById('ownedProgress');if(box){box.querySelector('i').style.width=pct+'%';box.querySelector('b').textContent=pct.toFixed(1)+'%'}};
   new MutationObserver(sync).observe(stats[1],{subtree:true,childList:true,characterData:true});setInterval(sync,700);sync();
 }
 const tools=d.querySelector('.tools');
 const controls=d.createElement('div');controls.className='compact-controls';controls.innerHTML=`<label class="compact-control"><span>등급</span><select id="gradeSelect"><option value="ALL">전체</option><option>UR</option><option>SSR</option><option>SR</option><option>R</option><option>N</option></select></label><label class="compact-control"><span>보유</span><select id="ownerSelect"><option value="ALL">전체</option><option value="OWNED">보유</option><option value="MISSING">미보유</option></select></label><label class="compact-control"><span>정렬</span><select id="sortSelect"><option value="DEFAULT">기본순</option><option value="KOREAN">가나다순</option></select></label>`;tools.appendChild(controls);
 w.__ownership='ALL';w.__sortMode='DEFAULT';
 try{w.eval(`list=function(){let z=query.toLowerCase();let a=flowers.filter(f=>(selected=='ALL'||f.g==selected)&&(window.__ownership=='ALL'||(window.__ownership=='OWNED'&&f.o.length>0)||(window.__ownership=='MISSING'&&f.o.length===0))&&(!z||f.n.toLowerCase().includes(z)||f.o.some(x=>x.toLowerCase().includes(z))));if(window.__sortMode=='KOREAN')a=[...a].sort((a,b)=>a.n.localeCompare(b.n,'ko'));return a}`)}catch(e){console.error(e)}
 d.getElementById('gradeSelect').onchange=e=>{try{w.eval(`selected=${JSON.stringify(e.target.value)};render()`)}catch(_){}};
 d.getElementById('ownerSelect').onchange=e=>{w.__ownership=e.target.value;try{w.eval('render()')}catch(_){}};
 d.getElementById('sortSelect').onchange=e=>{w.__sortMode=e.target.value;try{w.eval('render()')}catch(_){}};
 const sheet=d.getElementById('sheet');
 if(sheet){
   const prev=d.createElement('button');prev.id='prevFlower';prev.className='nav-arrow prev';prev.textContent='‹';
   const next=d.createElement('button');next.id='nextFlower';next.className='nav-arrow next';next.textContent='›';sheet.append(prev,next);
   try{w.eval(`open=function(i){window.__currentFlowerId=i;let f=flowers.find(x=>x.id==i);if(!f)return;big.src=f.img||'';name.textContent=f.n;g.textContent=f.g;oc.textContent=f.o.length+'명';owners.innerHTML=f.o.length?f.o.map(x=>'<span class="owner">'+esc(x)+'</span>').join(''):'<span class="owner none">현재 등록된 보유자가 없습니다.</span>';let a=list(),p=a.findIndex(x=>x.id==i);prevFlower.disabled=p<=0;nextFlower.disabled=p<0||p>=a.length-1;sheet.showModal()};window.__navFlower=function(delta){let a=list(),p=a.findIndex(x=>x.id==window.__currentFlowerId),n=p+delta;if(n>=0&&n<a.length)open(a[n].id)}`)}catch(e){console.error(e)}
   prev.onclick=()=>{try{w.eval('window.__navFlower(-1)')}catch(_){}};next.onclick=()=>{try{w.eval('window.__navFlower(1)')}catch(_){}};
 }
});
</script></body></html>

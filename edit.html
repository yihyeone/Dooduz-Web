<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4a2b1d">
<title>내 꽃 수정 | 두더지도굴단 꽃 도감</title>
<style>
:root{--brown:#4a2b1d;--cream:#fffaf0;--line:#eadcc8;--green:#58a36b;--text:#4b3425;--muted:#8a725f}
*{box-sizing:border-box}body{margin:0;background:#f4ecdf;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.page{width:min(100%,680px);min-height:100vh;margin:auto;background:var(--cream)}
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 9px;background:linear-gradient(180deg,#4a2b1d,#382016);color:#fff4dd;box-shadow:0 3px 12px rgba(48,25,15,.2)}.home{width:40px;height:40px;display:grid;place-items:center;color:inherit;text-decoration:none}.home svg{width:23px;fill:none;stroke:currentColor;stroke-width:2}.top h1{margin:0;text-align:center;font-size:18px}.wrap{padding:18px 16px 110px}
.panel{padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 5px 16px rgba(90,57,31,.08)}.panel h2{margin:0 0 7px;font-size:20px}.panel p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}.field{display:grid;gap:7px;margin-top:13px}.field label{font-size:13px;font-weight:900}.field input{width:100%;height:48px;border:1px solid #d9c7b0;border-radius:13px;padding:0 14px;background:#fffdf8;color:var(--text);font-size:16px;outline:none}.field input:focus{border-color:#bd864f;box-shadow:0 0 0 3px rgba(189,134,79,.15)}
.btn{width:100%;min-height:50px;margin-top:16px;border:0;border-radius:14px;background:#4a2b1d;color:#fff4dd;font-size:16px;font-weight:950;cursor:pointer}.btn:disabled{opacity:.55}.error{min-height:20px;margin-top:10px;color:#b24636;font-size:13px;font-weight:800}
.editor{display:none}.editor.on{display:block}.login.off{display:none}.member-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.member-head strong{font-size:18px}.owned-count{color:var(--green);font-weight:950}
.tools{position:sticky;top:57px;z-index:15;margin:0 -16px 12px;padding:11px 16px;background:rgba(255,250,240,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}.search{width:100%;height:43px;border:1px solid #d9c7b0;border-radius:12px;padding:0 13px;font-size:15px}.grades{display:flex;gap:6px;margin-top:8px}.grades button{flex:1;min-height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font-weight:900}.grades button.on{box-shadow:inset 0 0 0 2px currentColor}
.list{display:grid;gap:8px}.flower{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}.flower input{width:22px;height:22px;accent-color:var(--green)}.flower-name{font-size:14px;font-weight:850}.grade{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:950}.grade-UR{background:#fde7ef;color:#ad4f72}.grade-SSR{background:#fff2c9;color:#876417}.grade-SR{background:#eee4fa;color:#6e4b9e}.grade-R{background:#e1f1fb;color:#37749a}.grade-N{background:#e5f3df;color:#4f7b3e}
.savebar{position:fixed;left:50%;bottom:0;z-index:30;width:min(100%,680px);transform:translateX(-50%);padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);background:rgba(255,250,240,.97);border-top:1px solid var(--line);backdrop-filter:blur(10px)}.savebar .btn{margin:0}.status{text-align:center;margin:0 0 7px;font-size:12px;font-weight:800;color:var(--muted)}
.setup{display:none;margin-top:12px;padding:12px;border-radius:12px;background:#fff3d5;color:#76531a;font-size:13px;font-weight:800}
</style>
</head>
<body><main class="page">
<header class="top"><a class="home" href="index.html" aria-label="홈으로"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a><h1>내 꽃 수정</h1><span></span></header>
<div class="wrap">
<section class="panel login" id="login"><h2>개인 PIN 확인</h2><p>꽃 정보는 누구나 볼 수 있지만, 본인 닉네임과 발급받은 개인 PIN이 일치할 때만 수정할 수 있습니다.</p>
<div class="field"><label for="pin">개인 PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="PIN 입력"></div>
<div class="field"><label for="nickname">내 닉네임</label><input id="nickname" maxlength="30" placeholder="게임 닉네임을 정확히 입력"></div>
<button class="btn" id="enter">내 보유 꽃 불러오기</button><div class="error" id="loginError"></div>
<div class="setup" id="setup">시트 저장 연결을 준비 중입니다. Apps Script 배포 주소가 연결되면 사용할 수 있습니다.</div></section>
<section class="editor" id="editor"><div class="member-head"><strong id="memberName"></strong><span class="owned-count"><b id="selectedCount">0</b>종 선택</span></div>
<div class="tools"><input class="search" id="search" placeholder="꽃 이름 검색"><div class="grades" id="grades"><button class="on" data-g="ALL">전체</button><button data-g="UR">UR</button><button data-g="SSR">SSR</button><button data-g="SR">SR</button><button data-g="R">R</button><button data-g="N">N</button></div></div>
<div class="list" id="list"></div><div class="savebar"><p class="status" id="status">변경 후 저장하기를 눌러주세요.</p><button class="btn" id="save">보유 꽃 저장하기</button></div></section>
</div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxY7OWiPo7oPRJciaSg3Jvomkv8PbuZ5JhhBMXcecjgUXE7vtWBQv5U0YXZk6fux3og/exec';
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSighkaGKMuouQNsjGsanPYmZE9jJ03_mIqUJ4RnFPhr5LKKVwNf2ZrgFpRdPl1cSDn3s7t5xTOOyo0/pub?gid=129712828&single=true&output=csv';
let pinValue='',nicknameValue='',flowers=[],grade='ALL',query='';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=ch}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function findCol(headers,names){const n=headers.map(x=>String(x).replace(/\s/g,'').toLowerCase());for(const name of names){const i=n.indexOf(name.replace(/\s/g,'').toLowerCase());if(i>=0)return i}return-1}
function owners(v){return String(v||'').split(/[,，\n]+/).map(x=>x.trim()).filter(Boolean)}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='dooduzCb'+Date.now()+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>done(new Error('응답 시간이 초과되었습니다.')),15000);function done(v){clearTimeout(timer);delete window[cb];s.remove();v instanceof Error?reject(v):resolve(v)}window[cb]=v=>done(v);s.onerror=()=>done(new Error('서버 연결에 실패했습니다.'));s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb});document.head.appendChild(s)})}
async function loadFlowers(){const text=await fetch(CSV_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});const rows=parseCSV(text),h=rows[0]||[];const name=findCol(h,['꽃 이름','꽃이름','이름']),g=findCol(h,['등급','Grade']),owner=findCol(h,['보유자 닉네임','보유자닉네임','보유자']);if(name<0||owner<0)throw Error('시트 열을 찾을 수 없습니다.');flowers=rows.slice(1).map((r,i)=>({row:i+2,name:String(r[name]||'').trim(),grade:String(r[g]||'').trim().toUpperCase(),owned:owners(r[owner]).includes(nicknameValue)})).filter(f=>f.name);render()}
function render(){const visible=flowers.filter(f=>(grade==='ALL'||f.grade===grade)&&(!query||f.name.toLowerCase().includes(query)));$('#list').innerHTML=visible.map(f=>'<label class="flower"><input type="checkbox" data-row="'+f.row+'" '+(f.owned?'checked':'')+'><span class="flower-name">'+esc(f.name)+'</span><span class="grade grade-'+esc(f.grade)+'">'+esc(f.grade)+'</span></label>').join('')||'<div class="panel">검색 결과가 없습니다.</div>';updateCount()}
function sync(){document.querySelectorAll('.flower input').forEach(x=>{const f=flowers.find(v=>v.row===Number(x.dataset.row));if(f)f.owned=x.checked});updateCount()}
function updateCount(){$('#selectedCount').textContent=flowers.filter(f=>f.owned).length}
$('#enter').onclick=async()=>{pinValue=$('#pin').value.trim();nicknameValue=$('#nickname').value.trim();$('#loginError').textContent='';if(!/^\d{4}$/.test(pinValue)){ $('#loginError').textContent='PIN을 숫자로 입력해 주세요.';return}if(!nicknameValue){$('#loginError').textContent='닉네임을 입력해 주세요.';return}if(API_URL.includes('__APPS_SCRIPT_URL__')){$('#setup').style.display='block';return}$('#enter').disabled=true;try{const v=await jsonp({action:'verify',pin:pinValue,nickname:nicknameValue});if(!v.ok)throw Error(v.error||'PIN이 올바르지 않습니다.');await loadFlowers();$('#memberName').textContent=nicknameValue+'님의 보유 꽃';$('#login').classList.add('off');$('#editor').classList.add('on')}catch(e){$('#loginError').textContent=e.message}finally{$('#enter').disabled=false}};
$('#list').addEventListener('change',sync);$('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};$('#grades').onclick=e=>{const b=e.target.closest('button');if(!b)return;grade=b.dataset.g;document.querySelectorAll('#grades button').forEach(x=>x.classList.toggle('on',x===b));render()};
$('#save').onclick=async()=>{sync();const rows=flowers.filter(f=>f.owned).map(f=>f.row).join(',');$('#save').disabled=true;$('#status').textContent='저장 중…';try{const v=await jsonp({action:'save',pin:pinValue,nickname:nicknameValue,rows});if(!v.ok)throw Error(v.error||'저장하지 못했습니다.');$('#status').textContent='저장 완료 · '+v.ownedCount+'종 보유';setTimeout(()=>location.href='index.html?updated=1',1000)}catch(e){$('#status').textContent=e.message;$('#save').disabled=false}};
</script></body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4a2b1d">
<title>길드원·PIN 관리 | 두더지도굴단 꽃 도감</title>
<style>
:root{--brown:#4a2b1d;--cream:#fffaf0;--line:#eadcc8;--green:#58a36b;--red:#b84e42;--text:#4b3425;--muted:#8a725f}
*{box-sizing:border-box}body{margin:0;background:#f4ecdf;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.page{width:min(100%,680px);min-height:100vh;margin:auto;background:var(--cream)}
.top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 9px;background:linear-gradient(180deg,#4a2b1d,#382016);color:#fff4dd;box-shadow:0 3px 12px rgba(48,25,15,.2)}.back{width:40px;height:40px;display:grid;place-items:center;color:inherit;text-decoration:none}.back svg{width:23px;fill:none;stroke:currentColor;stroke-width:2}.top h1{margin:0;text-align:center;font-size:18px}.wrap{padding:18px 16px 90px}
.panel{padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 5px 16px rgba(90,57,31,.08)}.panel h2{margin:0 0 7px;font-size:20px}.panel p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.55}
.field{display:grid;gap:7px;margin-top:12px}.field label{font-size:13px;font-weight:900}.field input{width:100%;height:47px;border:1px solid #d9c7b0;border-radius:13px;padding:0 14px;background:#fffdf8;color:var(--text);font-size:16px;outline:none}.field input:focus,.pin-input:focus{border-color:#bd864f;box-shadow:0 0 0 3px rgba(189,134,79,.15)}
.btn{min-height:46px;border:0;border-radius:13px;background:var(--brown);color:#fff4dd;font-size:15px;font-weight:950;cursor:pointer}.login .btn{width:100%;margin-top:16px}.btn:disabled{opacity:.55}.error{min-height:20px;margin-top:10px;color:var(--red);font-size:13px;font-weight:850}.manager{display:none}.manager.on{display:block}.login.off{display:none}
.notice{margin-bottom:12px;padding:12px 14px;border-radius:14px;background:#edf7e9;color:#426f36;font-size:12px;font-weight:850;line-height:1.5}.add{display:grid;grid-template-columns:minmax(0,1fr) 88px 64px;gap:7px;margin-bottom:14px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.add input,.pin-input{min-width:0;height:42px;border:1px solid #d9c7b0;border-radius:11px;padding:0 11px;background:#fffdf8;color:var(--text);font-size:14px;outline:none}.add .btn{min-height:42px;background:var(--green)}
.member-head{position:sticky;top:57px;z-index:15;display:flex;align-items:center;justify-content:space-between;margin:0 -16px 10px;padding:11px 16px;background:rgba(255,250,240,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}.member-head strong{font-size:16px}.member-head span{font-size:12px;color:var(--muted);font-weight:850}
.list{display:grid;gap:8px}.member{display:grid;grid-template-columns:minmax(0,1fr) 82px 48px 48px;align-items:center;gap:6px;padding:10px 10px 10px 13px;border:1px solid var(--line);border-radius:14px;background:#fff}.nickname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:900}.nickname.admin:after{content:"관리자";display:inline-block;margin-left:6px;padding:3px 6px;border-radius:999px;background:#fff2c9;color:#876417;font-size:9px;vertical-align:1px}.small{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--brown);font-weight:900;cursor:pointer}.small.delete{color:var(--red)}.small:disabled{opacity:.35}.status{min-height:22px;margin:9px 0;color:var(--muted);font-size:12px;font-weight:850;text-align:center}
@media(max-width:390px){.member{grid-template-columns:minmax(0,1fr) 70px 44px 44px;padding-left:10px}.pin-input{padding:0 8px}.add{grid-template-columns:minmax(0,1fr) 76px 58px}}
</style>
</head>
<body><main class="page">
<header class="top"><a class="back" href="edit.html" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a><h1>길드원·PIN 관리</h1><a class="back" href="index.html" aria-label="홈으로"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a></header>
<div class="wrap">
<section class="panel login" id="login"><h2>관리자 확인</h2><p>두더지도굴단 관리자 PIN으로 길드원을 추가·삭제하거나 개인 PIN을 변경할 수 있습니다.</p><div class="field"><label for="adminPin">관리자 PIN</label><input id="adminPin" type="password" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="숫자 4자리"></div><button class="btn" id="enter">관리 화면 열기</button><div class="error" id="loginError"></div></section>
<section class="manager" id="manager"><div class="notice">닉네임은 시트의 보유자 닉네임과 정확히 같아야 합니다. PIN 변경 기록에는 PIN 숫자를 남기지 않습니다.</div>
<div class="add"><input id="newNickname" maxlength="30" placeholder="새 길드원 닉네임"><input id="newPin" inputmode="numeric" maxlength="4" placeholder="PIN"><button class="btn" id="add">추가</button></div>
<div class="member-head"><strong>등록된 길드원</strong><span><b id="memberCount">0</b>명</span></div><div class="list" id="list"></div><div class="status" id="status"></div></section>
</div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxY7OWiPo7oPRJciaSg3Jvomkv8PbuZ5JhhBMXcecjgUXE7vtWBQv5U0YXZk6fux3og/exec';
const ADMIN_NICKNAME='두더지도굴단';
let adminPin='',members=[];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function jsonp(params){return new Promise((resolve,reject)=>{const cb='dooduzAdminCb'+Date.now()+Math.random().toString(36).slice(2);const s=document.createElement('script');const timer=setTimeout(()=>done(new Error('응답 시간이 초과되었습니다.')),15000);function done(v){clearTimeout(timer);delete window[cb];s.remove();v instanceof Error?reject(v):resolve(v)}window[cb]=v=>done(v);s.onerror=()=>done(new Error('서버 연결에 실패했습니다.'));s.src=API_URL+'?'+new URLSearchParams({...params,callback:cb});document.head.appendChild(s)})}
function render(){members.sort((a,b)=>a.nickname===ADMIN_NICKNAME?-1:b.nickname===ADMIN_NICKNAME?1:a.nickname.localeCompare(b.nickname,'ko'));$('#memberCount').textContent=members.length;$('#list').innerHTML=members.map(m=>'<div class="member" data-name="'+esc(m.nickname)+'"><span class="nickname '+(m.nickname===ADMIN_NICKNAME?'admin':'')+'">'+esc(m.nickname)+'</span><input class="pin-input" inputmode="numeric" maxlength="4" value="'+esc(m.pin)+'" aria-label="'+esc(m.nickname)+' PIN"><button class="small save" type="button">저장</button><button class="small delete" type="button" '+(m.nickname===ADMIN_NICKNAME?'disabled':'')+'>삭제</button></div>').join('')}
async function request(params){$('#status').textContent='처리 중…';const v=await jsonp({...params,pin:adminPin});if(!v.ok)throw Error(v.error||'처리하지 못했습니다.');if(v.members){members=v.members;render()}$('#status').textContent='완료되었습니다.';return v}
$('#enter').onclick=async()=>{adminPin=$('#adminPin').value.trim();$('#loginError').textContent='';if(!/^\d{4}$/.test(adminPin)){ $('#loginError').textContent='관리자 PIN을 숫자 4자리로 입력해 주세요.';return}$('#enter').disabled=true;try{const v=await jsonp({action:'admin-list',pin:adminPin});if(!v.ok)throw Error(v.error||'관리자 PIN이 올바르지 않습니다.');members=v.members||[];render();$('#login').classList.add('off');$('#manager').classList.add('on')}catch(e){$('#loginError').textContent=e.message}finally{$('#enter').disabled=false}};
$('#add').onclick=async()=>{const memberNickname=$('#newNickname').value.trim(),memberPin=$('#newPin').value.trim();if(!memberNickname||!/^\d{4}$/.test(memberPin)){ $('#status').textContent='닉네임과 숫자 4자리 PIN을 입력해 주세요.';return}$('#add').disabled=true;try{await request({action:'admin-save-member',memberNickname,memberPin});$('#newNickname').value='';$('#newPin').value=''}catch(e){$('#status').textContent=e.message}finally{$('#add').disabled=false}};
$('#list').onclick=async e=>{const row=e.target.closest('.member');if(!row)return;const memberNickname=row.dataset.name;if(e.target.classList.contains('save')){const memberPin=row.querySelector('.pin-input').value.trim();if(!/^\d{4}$/.test(memberPin)){ $('#status').textContent='PIN은 숫자 4자리로 입력해 주세요.';return}e.target.disabled=true;try{await request({action:'admin-save-member',memberNickname,memberPin});if(memberNickname===ADMIN_NICKNAME)adminPin=memberPin}catch(err){$('#status').textContent=err.message}finally{e.target.disabled=false}}if(e.target.classList.contains('delete')){if(!confirm(memberNickname+' 길드원을 삭제할까요?\n해당 닉네임의 꽃 보유 기록도 함께 삭제됩니다.'))return;e.target.disabled=true;try{await request({action:'admin-delete-member',memberNickname})}catch(err){$('#status').textContent=err.message;e.target.disabled=false}}};
</script></body></html>

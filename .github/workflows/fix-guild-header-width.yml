name: Fix guild fixed header width
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-guild-header-width.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch final header overrides
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('guild-test-v2.html')
          s=p.read_text()
          css='''<style id="guild-header-width-fix">
          html,body{width:100%;max-width:100%;overflow-x:hidden}
          main{padding-top:calc(58px + env(safe-area-inset-top,0px))!important}
          .titlebar{
            position:fixed!important;
            top:0!important;
            left:0!important;
            right:0!important;
            transform:none!important;
            width:100%!important;
            max-width:none!important;
            margin:0!important;
            padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px!important;
            min-height:calc(54px + env(safe-area-inset-top,0px))!important;
            background:#4a2b1d!important;
            color:#fff!important;
            z-index:100!important;
          }
          .titlebar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
          nav#nav{top:calc(54px + env(safe-area-inset-top,0px))!important;z-index:90!important}
          .head{top:calc(103px + env(safe-area-inset-top,0px))!important;z-index:80!important}
          </style>'''
          if 'id="guild-header-width-fix"' in s:
              import re
              s=re.sub(r'<style id="guild-header-width-fix">.*?</style>',css,s,flags=re.S)
          else:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add guild-test-v2.html
          git commit -m '길전 상단 고정바 전체폭 및 잘림 수정' || exit 0
          git push

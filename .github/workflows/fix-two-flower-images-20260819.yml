name: Fix two flower image mappings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-two-flower-images-20260819.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch actual loader image map
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert s.count('const missingImages=') == 1
          m = re.search(r'(const missingImages=)(\{.*?\})(;)', s, re.S)
          assert m, 'missingImages marker not found'
          images = json.loads(m.group(2))
          blue = './images/aug19/01.webp?v=20260820a'
          fire = './images/aug19/05.webp?v=20260820a'
          images['블루스타 납매'] = blue
          images['블루스타 남매'] = blue
          images['불꽃심장 꿈조개'] = fire
          new_obj = json.dumps(images, ensure_ascii=False, separators=(',',':'))
          s2 = s[:m.start()] + m.group(1) + new_obj + m.group(3) + s[m.end():]
          assert '"블루스타 납매":"./images/aug19/01.webp?v=20260820a"' in s2
          assert '"불꽃심장 꿈조개":"./images/aug19/05.webp?v=20260820a"' in s2
          p.write_text(s2, encoding='utf-8')

          start = s2.find('<body><script>')
          end = s2.rfind('</script></body></html>')
          assert start >= 0 and end > start, 'outer script marker not found'
          outer = s2[start + len('<body><script>'):end]
          Path('/tmp/dooduz-outer.js').write_text(outer, encoding='utf-8')
          PY
          node --check /tmp/dooduz-outer.js
          git diff --check
      - name: Commit actual mapping change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '블루스타 납매·불꽃심장 꿈조개 실제 이미지 맵 연결'
          git push

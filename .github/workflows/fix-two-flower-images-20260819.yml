name: Fix two flower image mappings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-two-flower-images-20260819.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only two image mappings
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert s.count('const missingImages=') == 1
          m = re.search(r'(\s+const missingImages=)(\{.*?\})(;\n\s+const imageAliases=)', s, re.S)
          assert m, 'missingImages marker not found'
          images = json.loads(m.group(2))
          images['블루스타 납매'] = './images/aug19/01.webp?v=20260819d'
          images['블루스타 남매'] = './images/aug19/01.webp?v=20260819d'
          images['불꽃심장 꿈조개'] = './images/aug19/05.webp?v=20260819d'
          new_obj = json.dumps(images, ensure_ascii=False, separators=(',',':'))
          s2 = s[:m.start()] + m.group(1) + new_obj + m.group(3) + s[m.end():]
          assert s2.count('블루스타 납매') >= 1
          assert s2.count('불꽃심장 꿈조개') >= 1
          p.write_text(s2, encoding='utf-8')

          outer = re.search(r'<body><script>\n(.*)\n</script></body></html>\s*$', s2, re.S)
          assert outer, 'outer script marker not found'
          Path('/tmp/dooduz-outer.js').write_text(outer.group(1), encoding='utf-8')
          PY
          node --check /tmp/dooduz-outer.js
      - name: Commit verified mapping change
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '블루스타 납매·불꽃심장 꿈조개 이미지 직접 연결'
          git push


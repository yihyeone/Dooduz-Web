name: Link guild sticky fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-guild-sticky-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link CSS safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('guild-test-v2.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="guild-sticky-fix.css?v=20260827-1907">'
          if link not in s:
              s=s.replace('<title>두더지도굴단 길드전 임무표</title>', '<title>두더지도굴단 길드전 임무표</title>'+link, 1)
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit
        run: |
          if git diff --quiet -- guild-test-v2.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guild-test-v2.html
          git commit -m '길드전 고정영역 구조 수정'
          git push

name: Rebuild guild images from main catalog
on:
  push:
    branches: [main]
    paths:
      - 'app.html'
      - '.github/workflows/rebuild-guild-catalog-images.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract main catalog image map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          app=Path('app.html').read_text(encoding='utf-8')
          pairs=re.findall(r'''["']([^"'\\]{1,120})["']\s*:\s*["'](data:image/(?:png|jpeg|jpg|webp);base64,[A-Za-z0-9+/=]+)["']''', app)
          images={k:v for k,v in pairs}
          if len(images) < 100:
              raise SystemExit(f'Image extraction looks wrong: only {len(images)} entries')
          if '동화의 성' not in images:
              raise SystemExit('Main catalog contains no extracted image for 동화의 성')
          out='window.GUILD_CATALOG_IMAGES='+json.dumps(images,ensure_ascii=False,separators=(',',':'))+';\n'
          Path('guild-catalog-images.js').write_text(out,encoding='utf-8')
          print('catalog images:',len(images))
          PY
      - name: Refresh guild image cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p=Path('guild-test-v2.html')
          s=p.read_text(encoding='utf-8')
          ver=os.environ.get('GITHUB_SHA','')[:12] or 'latest'
          s=re.sub(r'guild-catalog-images\.js(?:\?v=[^"\']+)?',f'guild-catalog-images.js?v={ver}',s)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit rebuilt map
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add guild-catalog-images.js guild-test-v2.html
          git commit -m '길전 썸네일을 메인 도감과 동기화' || exit 0
          git push

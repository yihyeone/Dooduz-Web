name: Fix broken flower image mappings 2026-09-12
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-broken-flower-images-20260912.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair late flower image mappings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          mappings = {
            '쌍둥이자리·성수쌍영':'./images/flower-assets/e8b48e90048478e5f5e0.webp',
            '피어나는 동심':'./images/flower-assets/cd6b5dc9c0acfaeba25c.webp',
            '구름빛 사절':'./images/flower-assets/ba4af1ad94ff317a60f0.webp',
            '서리구름마':'./images/flower-assets/86f4109a1cf636a6ea08.webp',
            '화려한 서커스':'./images/flower-assets/ed7f33da2ed21e441672.webp',
            '별의 시간의 사도':'./images/flower-assets/20f9eae1457c3624f13a.webp',
            '곰 돛 구름배':'./images/flower-assets/c3746494684d6a00957a.webp',
            '곰 듯 구름배':'./images/flower-assets/c3746494684d6a00957a.webp',
            '분홍빛 생일잔치':'./images/flower-assets/46cc343d8ccc026f4e68.webp',
            '핏빛 달의 피안화':'./images/flower-assets/1ad5f47a3081df9a2b6f.webp',
            '별 연꽃 시간 고리':'./images/flower-assets/24a162747589d12d69f3.webp',
            '고택 성자':'./images/flower-assets/1a93fdbe57bac72f1141.webp',
            '불꽃 솜털 국화':'./images/aug21/03.webp?v=20260821a',
            '명월유합':'./images/flower-assets/c945d85e147fa01327c9.webp',
            '보랏빛 밤의 성단':'./images/flower-assets/6931cdee2ea007899046.webp',
            '몬스테라':'./images/flower-assets/8905acffd58051e4da6f.webp',
            '앵구다정':'./images/flower-assets/2b88004252937a9f1886.webp',
            '분홍 방울':'./images/flower-assets/1d71ff81c2d9aa79f6fa.webp',
            '진홍빛 백일초':'./images/flower-assets/af1ca0fbc41b00c872df.webp',
            '금잔화 궁등':'./images/flower-assets/b3e6505ebab2912fb4a3.webp',
            '썬글로우 히페리쿰':'./images/flower-assets/f3153e27482667415961.webp',
            '무지개빛 구름 바퀴':'./images/flower-assets/ef9cb9c65c8de6eb0220.webp',
            '무지개빛 구름바퀴':'./images/flower-assets/ef9cb9c65c8de6eb0220.webp'
          }

          fup = Path('flower-update.js')
          fup.write_text(fup.read_text(encoding='utf-8').replace('명월유향','명월유합'), encoding='utf-8')
          Path('images/sep12-extra-06.js').write_text(
              'Object.assign(window.NEW_FLOWER_IMAGES=window.NEW_FLOWER_IMAGES||{}, {"별 연꽃 시간 고리":"./images/flower-assets/24a162747589d12d69f3.webp"});\n',
              encoding='utf-8'
          )

          def patch_json_object(path, pattern, prefix, suffix):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              m = re.search(pattern, s, re.S)
              if not m:
                  raise SystemExit(f'object not found in {path}')
              obj = json.loads(m.group(1))
              obj.update(mappings)
              encoded = json.dumps(obj, ensure_ascii=False, separators=(',',':'))
              p.write_text(s[:m.start()] + prefix + encoded + suffix + s[m.end():], encoding='utf-8')

          patch_json_object('app.html', r'const IMAGES=(\{.*?\});\s*const norm=', 'const IMAGES=', ';\nconst norm=')
          patch_json_object('guild-catalog-images.js', r'window\.GUILD_CATALOG_IMAGES=(\{.*\});\s*$', 'window.GUILD_CATALOG_IMAGES=', ';\n')

          ip = Path('index.html')
          s = ip.read_text(encoding='utf-8')
          start = '// BROKEN_IMAGE_FIX_20260912_START'; end = '// BROKEN_IMAGE_FIX_20260912_END'
          s = re.sub(re.escape(start)+r'.*?'+re.escape(end)+r'\n?', '', s, flags=re.S)
          marker = 'const imageAliases='
          if marker not in s: raise SystemExit('index marker missing')
          block = start+'\nObject.assign(missingImages,'+json.dumps(mappings, ensure_ascii=False, separators=(',',':'))+');\n'+end+'\n'
          ip.write_text(s.replace(marker, block+marker, 1), encoding='utf-8')

          missing=[]
          for flower, ref in mappings.items():
              if ref.startswith('./'):
                  local=Path(ref[2:].split('?',1)[0])
                  if not local.exists(): missing.append((flower,str(local)))
          if missing: raise SystemExit('missing image files: '+repr(missing))
          for file in ['app.html','index.html','guild-catalog-images.js','images/sep12-extra-06.js']:
              if 'data:image/' in Path(file).read_text(encoding='utf-8'):
                  raise SystemExit('embedded image remains in '+file)
          print('repaired mappings:', len(mappings))
          PY
      - name: Validate JavaScript and diff
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.find('<script>'); b=s.rfind('</script>')
          if a < 0 or b <= a: raise SystemExit('index script markers missing')
          Path('/tmp/index-outer.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/index-outer.js
          git diff --check
      - name: Commit repaired mappings
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html index.html guild-catalog-images.js flower-update.js images/sep12-extra-06.js
          git commit -m '엑박 꽃 이미지 매핑 일괄 복구' || exit 0
          git push
# trigger: app regex fixed

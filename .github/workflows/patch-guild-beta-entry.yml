name: Patch guild beta entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-guild-beta-entry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='guild-entry-runtime.js'
          if marker not in s:
              anchor='    document.open();document.write(s);document.close();'
              assert anchor in s, 'document.write anchor not found'
              line="    s=s.replace('</body>','<script src=\"./guild-entry-runtime.js?v=20260827\"></script></body>');\n"
              s=s.replace(anchor,line+anchor)
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '웹도감 홈에 길드전 임무표 BETA 연결'
          git push

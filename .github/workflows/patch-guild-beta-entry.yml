name: Patch guild beta entry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-guild-beta-entry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index loader
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='guildBattleBetaEntry'
          if marker in s:
              print('already patched')
          else:
              anchor='    document.open();document.write(s);document.close();'
              assert anchor in s, 'document.write anchor not found'
              inject=r'''    s=s.replace('</body>',`<script id="guild-beta-entry-script">(function(){function m(){if(document.getElementById('guildBattleBetaEntry'))return true;var input=document.querySelector('input[placeholder*="꽃 이름"],input[placeholder*="보유자"]');if(!input)return false;var tools=input.closest('.tools')||input.parentElement;var a=document.createElement('a');a.id='guildBattleBetaEntry';a.href='./guild-test.html';a.setAttribute('aria-label','길드전 임무표 BETA 열기');a.innerHTML='<span style="font-weight:800">⚔ 길드전 임무표</span><span style="font-size:10px;font-weight:800;letter-spacing:.04em;padding:3px 6px;border-radius:999px;background:#efe4d5;color:#7a5946">BETA</span><span style="margin-left:auto;color:#9a8171;font-size:16px">›</span>';a.style.cssText='display:flex;align-items:center;gap:7px;width:100%;margin:8px 0 10px;padding:11px 13px;border:1px solid #e3d6c7;border-radius:12px;background:#fffdf9;color:#4a2b1d;text-decoration:none;font-size:13px;box-shadow:0 1px 2px rgba(74,43,29,.03);';tools.parentElement.insertBefore(a,tools);return true}function go(){if(m())return;var o=new MutationObserver(function(){if(m())o.disconnect()});o.observe(document.body,{childList:true,subtree:true});setTimeout(function(){o.disconnect()},10000)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()})();<\/script></body>`);
'''
              s=s.replace(anchor,inject+anchor)
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m '웹도감 홈에 길드전 임무표 BETA 연결'
          git push

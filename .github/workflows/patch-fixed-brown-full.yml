name: Patch full brown fixed area

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch brown fixed area CSS only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* DOODUZ_FIXED_BROWN_FULL */'
          css='''<style id="dooduz-fixed-brown-full">\n/* DOODUZ_FIXED_BROWN_FULL */\n:root{--dooduz-brown:#4a2b1d}\n.main-header{background:var(--dooduz-brown)!important;background-image:none!important;border-radius:0!important;box-shadow:none!important}\n.stats{position:relative!important;z-index:1!important;box-shadow:0 0 0 100vmax var(--dooduz-brown)!important;clip-path:inset(-18px -100vmax)!important}\n.tools{position:relative!important;z-index:1!important;background:var(--dooduz-brown)!important;background-image:none!important;box-shadow:0 0 0 100vmax var(--dooduz-brown)!important;clip-path:inset(-18px -100vmax)!important;margin-top:0!important;margin-bottom:0!important;padding-top:14px!important;padding-bottom:16px!important}\n.tools .filter-label,.tools>span,.grade-filters+span{color:#fffaf0!important}\n.search{background:#fff!important}\n</style>'''
          if marker in s:
              import re
              s=re.sub(r'<style id="dooduz-fixed-brown-full">.*?</style>',css,s,flags=re.S)
          else:
              needle='document.open();document.write(s);document.close();'
              if needle not in s:
                  raise SystemExit('write marker not found; abort')
              inject="s=s.replace('</head>',"+repr(css+"</head>")+");\n"
              s=s.replace(needle,inject+needle,1)
          p.write_text(s,encoding='utf-8')
          print('patched fixed brown area')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "고정영역 전체 브라운 단색 확장"
          git push

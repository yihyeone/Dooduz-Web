name: List view grade colors 2026-09-13
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/list-view-grade-colors-20260913.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply grade colors to flower names in list view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')

          css='''.grid.text-view .card.grade-UR .info h3{color:#c48700}.grid.text-view .card.grade-SSR .info h3{color:#9b59b6}.grid.text-view .card.grade-SR .info h3{color:#4f86c6}.grid.text-view .card.grade-R .info h3{color:#5f9d55}.grid.text-view .card.grade-N .info h3{color:#8b7b6a}'''
          if css not in s:
              marker='</style>'
              idx=s.find(marker)
              if idx<0: raise SystemExit('style marker not found')
              s=s[:idx]+css+s[idx:]

          script='''<script id="doguldan-list-grade-colors">(()=>{const apply=()=>{document.querySelectorAll('#grid .card').forEach(card=>{card.classList.remove('grade-UR','grade-SSR','grade-SR','grade-R','grade-N');const meta=card.querySelector('.meta');if(!meta)return;const t=(meta.textContent||'').toUpperCase();const g=['UR','SSR','SR','R','N'].find(x=>new RegExp('(^|\\s)'+x+'(\\s|$)').test(t));if(g)card.classList.add('grade-'+g);});};apply();const grid=document.getElementById('grid');if(grid)new MutationObserver(apply).observe(grid,{childList:true,subtree:true});})();</script>'''
          if 'id="doguldan-list-grade-colors"' not in s:
              marker='</body>'
              if marker not in s: raise SystemExit('body marker not found')
              s=s.replace(marker,script+marker,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('app.html').read_text(encoding='utf-8')
          assert 'grade-UR' in s and 'grade-SSR' in s and 'grade-SR' in s and 'grade-R' in s and 'grade-N' in s
          assert 'doguldan-list-grade-colors' in s
          PY
          git diff --check
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html
          git commit -m '목록 보기 꽃 이름을 등급색으로 표시' || exit 0
          git push

name: Home grid 4 columns 2026-09-13
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-grid-4cols-20260913.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update home flower grid to 4 columns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          old='.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:0;background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden;text-align:left;box-shadow:var(--shadow)}.thumb{width:100%;aspect-ratio:212/279;object-fit:cover;display:block}.info{padding:9px 10px 10px}.info h3{font-size:13px;margin:0 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:800}.meta strong{color:var(--green)}'
          new='.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.card{padding:0;background:white;border:1px solid var(--line);border-radius:11px;overflow:hidden;text-align:left;box-shadow:var(--shadow)}.thumb{width:100%;aspect-ratio:212/279;object-fit:cover;display:block}.info{padding:6px 6px 7px}.info h3{font-size:10px;margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);font-weight:800;gap:2px}.meta strong{color:var(--green)}'
          if old not in s:
              raise SystemExit('target grid CSS not found; aborting without changes')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.html
          git commit -m '홈 꽃 카드 한 줄 4개로 변경' || exit 0
          git push

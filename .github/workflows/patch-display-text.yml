name: Fix header replacement condition

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix source header matcher only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<header><div class=\\"brand\\"><h1>🍀두더지도굴단 전용꽃도감🍀</h1></div><button class=\\"refresh\\" id=\\"refresh\\">↻ 새로고침</button></header>'
          new = '<header><div class=\\"brand\\"><small>더 코지 플로리스트 · 길드 전용</small><h1>두더지도굴단 꽃 도감 🌱</h1></div><button class=\\"refresh\\" id=\\"refresh\\">↻ 새로고침</button></header>'
          if old not in s:
              raise SystemExit('expected broken matcher not found; aborting without touching file')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Fixed header source matcher')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "상단 치환 조건 복구"
          git push

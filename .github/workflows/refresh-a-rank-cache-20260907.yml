name: Refresh A rank cache
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-a-rank-cache-20260907.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/guild-rank-a-20260901.js?v=20260901-0950/guild-rank-a-20260901.js?v=20260907-0305/' guild-test-v2.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add guild-test-v2.html
          git commit -m 'A랭 길전 데이터 캐시 갱신' || exit 0
          git push
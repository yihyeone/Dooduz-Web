name: Fix popup viewport

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-popup-viewport.yml

permissions:
  contents: write

jobs:
  fix-popup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply popup viewport fix
        run: python scripts/fix_popup_viewport.py

      - name: Commit website fix and clean up one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-popup-viewport.yml scripts/fix_popup_viewport.py
          git add index.html
          git commit -m "Fix popup viewport positioning"
          git push

name: Fix card popup viewport position

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-popup-viewport.yml

permissions:
  contents: write

jobs:
  patch-popup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch popup CSS safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = "doguldan-popup-viewport-fix"
          if marker not in html:
              css = """
          <style id="doguldan-popup-viewport-fix">
          dialog#sheet.sheet {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            right: auto !important;
            bottom: auto !important;
            transform: translate(-50%, -50%) !important;
            margin: 0 !important;
            max-height: min(88dvh, 760px) !important;
            overflow-y: auto !important;
          }
          </style>
          """
              if "</head>" in html:
                  html = html.replace("</head>", css + "</head>", 1)
              else:
                  html = css + html
              path.write_text(html, encoding="utf-8")
          PY

      - name: Commit popup fix
        run: |
          if git diff --quiet -- index.html; then
            echo "Popup fix already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix flower popup position after scrolling"
          git push
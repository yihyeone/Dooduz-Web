name: Load guild auto batch 20260828
on:
  push:
    branches: [main]
    paths: ['.github/workflows/load-guild-auto-20260828.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add batch script to guild page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('guild-test-v2.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="guild-auto-20260828.js"></script>'
          if tag not in s:
              anchor='<script src="guild-new-observations.js"></script>'
              if anchor not in s: raise SystemExit('anchor missing')
              s=s.replace(anchor,anchor+tag,1)
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit
        run: |
          if git diff --quiet -- guild-test-v2.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add guild-test-v2.html
          git commit -m '길전 20260828 자동 수집 배치 로드'
          git push

name: Apply brown fixed UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add brown fixed-area CSS override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = "s=s.replace('</head>',css+'</head>');"
          if marker not in s:
              raise SystemExit('safe injection marker not found; aborting without touching index.html')

          override = r'''<style id="brown-fixed-ui">
          /* Brown fixed area: header through filters. CSS-only override. */
          .main-header{
            background:#4a2b1d!important;
            background-image:none!important;
            box-shadow:none!important;
            border:0!important;
          }
          .main-header .home-brand,
          .main-header .home-brand h1{
            color:#fffaf0!important;
          }
          .tools{
            background:#4a2b1d!important;
            background-image:none!important;
            box-shadow:none!important;
            border:0!important;
            color:#fffaf0!important;
          }
          .tools::before,.tools::after{
            background:none!important;
            box-shadow:none!important;
          }
          .tools .search,
          .tools input[type="search"],
          .tools input[type="text"]{
            background:#fff!important;
          }
          .tools .filters,
          .tools .filter-row,
          .tools .filter-group,
          .tools .grade-filters,
          .tools .ownership-filters,
          .tools .sort-wrap{
            background:transparent!important;
          }
          .tools .filter-label,
          .tools .filters>span,
          .tools .filter-row>span,
          .tools .filter-group>span{
            color:#f7eadc!important;
          }
          </style>'''

          replacement = "s=s.replace('</head>',css+" + repr(override) + "+'</head>');"
          s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          print('Applied brown fixed-area CSS override only')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-brown-fixed-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "고정영역 브라운 단색 배경 적용"
          git push

name: Guild default delete and catalog image fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/guild-default-delete-fallback-image.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build catalog image map and patch guild page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          app = Path('app.html').read_text(encoding='utf-8')
          m = re.search(r'const IMAGES=(\{.*?\});\s*const ', app, re.S)
          if not m:
              m = re.search(r'const IMAGES=(\{.*?\});', app, re.S)
          if not m:
              raise SystemExit('IMAGES map not found in app.html')
          images = json.loads(m.group(1))
          Path('guild-catalog-images.js').write_text('window.GUILD_CATALOG_IMAGES='+json.dumps(images, ensure_ascii=False, separators=(',',':'))+';', encoding='utf-8')

          p=Path('guild-test-v2.html')
          s=p.read_text(encoding='utf-8')
          if '<script src="guild-catalog-images.js"></script>' not in s:
              anchor='<script src="guild-data-1.js"></script>'
              s=s.replace(anchor,'<script src="guild-catalog-images.js"></script>'+anchor,1)

          # remove the previously incorrect fake assets/flower_NNN.webp mapping
          s=re.sub(r";if\(!window\.CATALOG_IMG\)window\.CATALOG_IMG=new Map;window\.CATALOG_IMG\.set\(nm,'assets/flower_'\+String\(a\.indexOf\(r\)\)\.padStart\(3,'0'\)\+'\\.webp'\)", '', s)
          s=s.replace("thumb:(window.CATALOG_IMG&&window.CATALOG_IMG.get(nm))||''", "thumb:(window.GUILD_CATALOG_IMAGES&&window.GUILD_CATALOG_IMAGES[nm])||''")
          s=s.replace("if(!bm.get(nm).thumb)bm.get(nm).thumb=(window.CATALOG_IMG&&window.CATALOG_IMG.get(nm))||''", "if(!bm.get(nm).thumb)bm.get(nm).thumb=(window.GUILD_CATALOG_IMAGES&&window.GUILD_CATALOG_IMAGES[nm])||''")
          p.write_text(s,encoding='utf-8')

          # validation: known catalog image map exists and guild page points to it
          assert len(images) > 100, len(images)
          assert 'guild-catalog-images.js' in s
          assert 'window.GUILD_CATALOG_IMAGES[nm]' in s
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add guild-test-v2.html guild-catalog-images.js
          git commit -m '길전 미확인 꽃에 실제 도감 이미지 연결' || exit 0
          git push
